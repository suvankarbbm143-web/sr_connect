async function restorePage(){

  const savedView =
    localStorage.getItem("sr_page_view") || "";

  const savedDocType =
    localStorage.getItem("sr_page_doctype") || "";

  const savedJob =
    localStorage.getItem("sr_current_job") || "";

  const savedWorkOrder =
    localStorage.getItem("sr_current_work_order") || "";

  const savedBatch =
    localStorage.getItem("sr_current_batch") || "";

  const savedSearch =
    localStorage.getItem("sr_page_search") || "";

  const savedBatchSearch =
    localStorage.getItem("sr_page_batch_search") || "";

  const savedFilter =
    localStorage.getItem("sr_page_job_filter") || "All";


  /*
   * =====================================================
   * 1. JOB CARD
   *
   * Highest priority.
   *
   * If a Job Card was open when browser was refreshed,
   * ALWAYS restore that exact Job Card.
   * Do NOT allow list restore to run.
   * =====================================================
   */

  if(savedJob){

    try{

      selectedJob = await api(
        "/api/method/sr_connect.www.home.get_job_card?job_card_id="
        + encodeURIComponent(savedJob)
      );

      if(selectedJob && selectedJob.name){

        currentView = "job";

        localStorage.setItem(
          "sr_page_view",
          "job"
        );

        localStorage.setItem(
          "sr_current_job",
          selectedJob.name
        );

        if(selectedJob.work_order){

          localStorage.setItem(
            "sr_current_work_order",
            selectedJob.work_order
          );

        }

        renderJob();

        console.debug(
          "SR RESTORE: Job Card",
          selectedJob.name
        );

        return;
      }

    }catch(e){

      console.debug(
        "SR RESTORE: Job Card failed",
        e
      );

      localStorage.removeItem(
        "sr_current_job"
      );

    }
  }


  /*
   * =====================================================
   * 2. WORK ORDER
   *
   * Restore exact Work Order if it was open.
   * =====================================================
   */

  if(savedWorkOrder){

    try{

      selectedWorkOrder = await api(
        "/api/method/sr_connect.www.home.get_work_order?work_order_id="
        + encodeURIComponent(savedWorkOrder)
      );

      if(selectedWorkOrder && selectedWorkOrder.name){

        currentView = "workOrder";

  window.removeWorkOrderCreateButton();

        localStorage.setItem(
          "sr_page_view",
          "workOrder"
        );

        localStorage.setItem(
          "sr_current_work_order",
          selectedWorkOrder.name
        );

        localStorage.removeItem(
          "sr_current_job"
        );

        renderWorkOrder();

        console.debug(
          "SR RESTORE: Work Order",
          selectedWorkOrder.name
        );

        return;
      }

    }catch(e){

      console.debug(
        "SR RESTORE: Work Order failed",
        e
      );

      localStorage.removeItem(
        "sr_current_work_order"
      );

    }
  }


  /*
   * =====================================================
   * 3. BATCH DETAIL
   *
   * If user was inside a Batch when browser was refreshed,
   * restore the same Batch page.
   *
   * Example:
   *
   * Not Started
   *      ↓
   * B238C
   *      ↓
   * RM WEIGING
   *
   * Browser Refresh
   *      ↓
   * B238C
   *      ↓
   * RM WEIGING
   *
   * Do NOT send the user back to the Job Card list.
   * =====================================================
   */

  if(
    savedView === "batchJobs" &&
    savedBatch
  ){

    try{

      currentDocType =
        savedDocType || "Job Card";

      jobFilter =
        savedFilter || "Not Started";

      /*
       * Load the same Job Card data first.
       * openBatchJobs() will then build the Batch detail.
       */

      await loadList(
        currentDocType,
        true
      );

      /*
       * loadList() is only used here to obtain the Job Cards.
       * The visible page MUST remain Batch Detail.
       */
      currentView = "batchJobs";

      localStorage.setItem(
        "sr_page_view",
        "batchJobs"
      );

      localStorage.setItem(
        "sr_current_batch",
        savedBatch
      );

      /*
       * Restore search fields.
       */

      const search =
        document.getElementById("search");

      if(search){
        search.value = savedSearch;
      }

      const batchSearch =
        document.getElementById("batchSearch");

      if(batchSearch){
        batchSearch.value =
          savedBatchSearch;
      }

      currentView = "batchJobs";

      localStorage.setItem(
        "sr_page_view",
        "batchJobs"
      );

      localStorage.setItem(
        "sr_current_batch",
        savedBatch
      );

      /*
       * Rebuild the exact Batch page.
       */

      openBatchJobs(savedBatch);

      /*
       * openBatchJobs() sets the page state itself.
       * Force it once more so no later list state
       * can overwrite it during this restore.
       */

      currentView = "batchJobs";

      localStorage.setItem(
        "sr_page_view",
        "batchJobs"
      );

      localStorage.setItem(
        "sr_current_batch",
        savedBatch
      );

      console.debug(
        "SR RESTORE: Batch",
        savedBatch
      );

      return;

    }catch(e){

      console.error(
        "SR RESTORE: Batch failed",
        e
      );

      localStorage.removeItem(
        "sr_current_batch"
      );

    }
  }


  /*
   * =====================================================
   * 4. LIST
   *
   * Only restore list when there is NO valid Job Card,
   * NO valid Work Order and NO valid Batch to restore.
   * =====================================================
   */

  if(
    savedView === "list" &&
    savedDocType
  ){

    currentDocType = savedDocType;
    jobFilter = savedFilter;

    await loadList(
      savedDocType,
      true
    );

    const search =
      document.getElementById("search");

    if(search){
      search.value = savedSearch;
    }

    const batchSearch =
      document.getElementById("batchSearch");

    if(batchSearch){
      batchSearch.value = savedBatchSearch;
    }

    renderList();

    currentView = "list";

    localStorage.setItem(
      "sr_page_view",
      "list"
    );

    console.debug(
      "SR RESTORE: List",
      savedDocType
    );

    return;
  }


  /*
   * =====================================================
   * 4. MANUFACTURING
   * =====================================================
   */

  if(savedView === "manufacturing"){

    showManufacturing();

    return;
  }


  /*
   * =====================================================
   * 5. PROFILE
   * =====================================================
   */

  if(savedView === "profile"){

    showProfile();

    return;
  }


  /*
   * =====================================================
   * 6. DEFAULT HOME
   * =====================================================
   */

  showHome();

}

window.srERPItemSearchTimer = null;


window.searchERPItems = function(query){

  const results =
    document.getElementById(
      "woItemResults"
    );

  const hidden =
    document.getElementById(
      "woProductionItem"
    );

  if(!results || !hidden){
    return;
  }

  clearTimeout(
    window.srERPItemSearchTimer
  );

  query =
    String(query || "")
      .trim();

  hidden.value = "";

  if(!query){

    results.innerHTML = "";

    results.classList.add(
      "hidden"
    );

    return;
  }

  window.srERPItemSearchTimer =
    setTimeout(
      async function(){

        results.classList.remove(
          "hidden"
        );

        results.innerHTML =
          '<div class="p-3 text-xs text-slate-400">'
          + 'Searching ERPNext...'
          + '</div>';

        try{

          const response =
            await fetch(
              "/api/method/frappe.desk.search.search_link"
              + "?doctype=Item"
              + "&txt="
              + encodeURIComponent(query)
              + "&page_length=20",
              {
                method:"GET",
                credentials:"same-origin",
                headers:{
                  "X-Frappe-CSRF-Token":
                    "{{ csrf_token }}"
                }
              }
            );

          const raw =
            await response.text();

          console.log(
            "ERP ITEM SEARCH STATUS:",
            response.status
          );

          console.log(
            "ERP ITEM SEARCH RESPONSE:",
            raw
          );

          let data;

          try{
            data = JSON.parse(raw);
          }catch(e){
            throw new Error(
              "ERPNext returned invalid JSON"
            );
          }

          if(
            !response.ok ||
            data.exc
          ){

            throw new Error(
              String(
                data.exception ||
                data.exc ||
                "ERPNext Item search failed"
              )
            );
          }

          const rows =
            Array.isArray(data.message)
              ? data.message
              : [];

          if(!rows.length){

            results.innerHTML =
              '<div class="p-3 text-xs text-slate-400">'
              + 'No matching ERP Item found.'
              + '</div>';

            return;
          }

          results.innerHTML =
            rows.map(
              function(row){

                const code =
                  row.value ||
                  row.name ||
                  "";

                const label =
                  row.description ||
                  row.item_name ||
                  code;

                return `
                  <button
                    type="button"
                    onclick="
                      window.selectERPItem(
                        '${escapeAttr(code)}',
                        '${escapeAttr(label)}'
                      )
                    "
                    class="w-full text-left px-3 py-3
                           border-b last:border-b-0
                           hover:bg-slate-50"
                  >

                    <div class="text-xs font-bold text-slate-800">
                      ${escapeHtml(label)}
                    </div>

                    ${
                      code !== label
                      ? `
                        <div class="text-[10px] text-slate-400 mt-1">
                          ${escapeHtml(code)}
                        </div>
                      `
                      : ""
                    }

                  </button>
                `;

              }
            ).join("");

        }catch(e){

          console.error(
            "ERP ITEM SEARCH ERROR:",
            e
          );

          results.innerHTML =
            '<div class="p-3 text-xs text-rose-500">'
            + escapeHtml(
                e.message ||
                "Unable to search ERPNext Items"
              )
            + '</div>';

        }

      },
      250
    );

};

window.loadWorkOrderBOMs = async function(){

  const hiddenItem =
    document.getElementById(
      "woProductionItem"
    );

  const bomSelect =
    document.getElementById(
      "woBOM"
    );

  const requiredBox =
    document.getElementById(
      "woRequiredItems"
    );

  if(
    !hiddenItem ||
    !bomSelect
  ){
    return;
  }

  const item =
    String(
      hiddenItem.value || ""
    ).trim();

  /*
   * Clear old BOM when Item changes.
   */
  bomSelect.innerHTML =
    '<option value="">Loading BOM...</option>';

  if(requiredBox){
    requiredBox.innerHTML = "";
  }

  if(!item){

    bomSelect.innerHTML =
      '<option value="">Select BOM</option>';

    return;
  }

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.get_work_order_create_data"
        + "?production_item="
        + encodeURIComponent(item)
    );

    /*
     * api() may already unwrap message.
     * Support both response shapes.
     */
    const payload =
      result && result.message
        ? result.message
        : result;

    const boms =
      Array.isArray(payload)
        ? payload
        : (
            payload &&
            Array.isArray(payload.items)
          )
          ? payload.items
          : [];

    /*
     * NO BOM
     */
    if(!boms.length){

      bomSelect.innerHTML =
        '<option value="">No BOM</option>';

      window.showBOMErrorNotification(
        "This item has no BOM created."
      );

      if(requiredBox){

        requiredBox.innerHTML = `
          <div
            class="p-3 rounded-xl
                   bg-rose-50
                   border border-rose-200
                   text-[10px]
                   text-rose-700
                   font-bold"
          >
            This item has no BOM created.
          </div>
        `;

      }

      return;
    }

    /*
     * SHOW ALL BOMs.
     */
    bomSelect.innerHTML =
      '<option value="">Select BOM</option>' +
      boms.map(
        function(b){

          const name =
            b.name || "";

          const label =
            b.is_default
              ? name + " — Default"
              : name;

          return `
            <option value="${escapeAttr(name)}">
              ${escapeHtml(label)}
            </option>
          `;

        }
      ).join("");

    /*
     * AUTO SELECT:
     * 1. Default BOM
     * 2. Otherwise first BOM
     */
    const selected =
      boms.find(
        function(b){
          return Number(
            b.is_default || 0
          ) === 1;
        }
      ) || boms[0];

    if(selected && selected.name){

      bomSelect.value =
        selected.name;

      /*
       * Immediately show ERPNext-calculated
       * Required Items once Qty exists.
       */
      if(
        typeof window.refreshWorkOrderPreview ===
        "function"
      ){

        await window.refreshWorkOrderPreview();

      }

    }

  }catch(e){

    console.error(
      "AUTO BOM FETCH ERROR:",
      e
    );

    bomSelect.innerHTML =
      '<option value="">BOM fetch failed</option>';

    window.showBOMErrorNotification(
      "BOM could not be fetched from ERPNext."
    );

  }

};

/* =========================================================
   WORK ORDER BATCH LOCK
   Not Started  -> editable
   In Process   -> locked
   Completed    -> locked
   ========================================================= */
window.srApplyWorkOrderBatchLock = function(){

  const status =
    String(
      (selectedWorkOrder && selectedWorkOrder.status) ||
      (window.srCreatedWorkOrder && window.srCreatedWorkOrder.status) ||
      ""
    ).trim();

  const inputs =
    Array.from(
      document.querySelectorAll('input[id="woNewBatch"]')
    );

  const editable =
    status === "" || status === "Not Started";

  inputs.forEach(function(el){

    el.disabled = !editable;
    el.readOnly = !editable;

    if(!editable){
      el.setAttribute("aria-readonly", "true");
      el.style.backgroundColor = "#f3f4f6";
      el.style.cursor = "not-allowed";
    }else{
      el.removeAttribute("aria-readonly");
      el.style.backgroundColor = "";
      el.style.cursor = "";
    }
  });

  console.log(
    "SR WORK ORDER BATCH LOCK:",
    {
      status: status,
      editable: editable,
      fields: inputs.length
    }
  );
};

window.getSRWorkOrderBatch = function(){

  const fields =
    Array.from(
      document.querySelectorAll(
        'input[id="woNewBatch"]'
      )
    );

  /*
   * Prefer the visible field containing a value.
   */
  const visible =
    fields.find(function(el){

      return (
        el.offsetParent !== null &&
        String(el.value || "").trim() !== ""
      );

    });

  if(visible){

    return String(
      visible.value || ""
    ).trim();

  }

  /*
   * Fallback to any non-empty field.
   */
  const nonEmpty =
    fields.find(function(el){

      return String(
        el.value || ""
      ).trim() !== "";

    });

  return nonEmpty
    ? String(
        nonEmpty.value || ""
      ).trim()
    : "";

};

  };

};

   ========================================================= */

let srRestoringHistory = false;


function srCurrentWorkOrderId(){

  return (
    (
      selectedWorkOrder &&
      selectedWorkOrder.name
    )
    ||
    (
      window.srCreatedWorkOrder &&
      window.srCreatedWorkOrder.name
    )
    ||
    localStorage.getItem(
      "sr_current_work_order"
    )
    ||
    ""
  );

}


function srPushHistory(
  view,
  data={}
){

  if(srRestoringHistory){
    return;
  }

  const current =
    history.state;

  const depth =
    current &&
    current.sr_connect
      ? Number(
          current.depth || 0
        ) + 1
      : 1;

  const state = {
    sr_connect: true,
    depth: depth,
    view: view,
    docType:
      data.docType ||
      currentDocType ||
      "Work Order",
    workOrder:
      data.workOrder ||
      srCurrentWorkOrderId() ||
      null,
    job:
      data.job ||
      (
        selectedJob &&
        selectedJob.name
      ) ||
      localStorage.getItem(
        "sr_current_job"
      ) ||
      null
  };

  history.pushState(
    state,
    "",
    window.location.pathname
  );

}


function srEnsureParent(
  view,
  data={}
){

  if(srRestoringHistory){
    return;
  }

  const current =
    history.state;

  if(
    current &&
    current.sr_connect &&
    current.view === view
  ){
    return;
  }

  srPushHistory(
    view,
    data
  );

}


/*
 * Initial browser history entry.
 */
(function(){

  const current =
    history.state;

  if(
    !current ||
    !current.sr_connect
  ){

    history.replaceState(
      {
        sr_connect: true,
        depth: 0,
        view:
          currentView ||
          "home",
        docType:
          currentDocType ||
          "Work Order",
        workOrder:
          srCurrentWorkOrderId() ||
          null,
        job:
          null
      },
      "",
      window.location.pathname
    );

  }

})();


/*
 * Browser BACK / FORWARD.
 */
window.addEventListener(
  "popstate",
  async function(event){

    const state =
      event.state;

    if(
      !state ||
      !state.sr_connect
    ){

      return;
    }

    srRestoringHistory =
      true;

    try{

      /*
       * HOME
       */
      if(
        state.view ===
        "home"
      ){

        localStorage.removeItem(
          "sr_current_work_order"
        );

        localStorage.removeItem(
          "sr_current_job"
        );

        currentView =
          "home";

        showHome();

        return;
      }


      /*
       * MANUFACTURING
       */
      if(
        state.view ===
        "manufacturing"
      ){

        currentView =
          "manufacturing";

        showManufacturing();

        return;
      }


      /*
       * WORK ORDER LIST
       */
      if(
        state.view ===
        "list"
      ){

        currentDocType =
          state.docType ||
          "Work Order";

        currentView =
          "list";

        await loadList(
          currentDocType,
          false
        );

        return;
      }


      /*
       * CREATE WORK ORDER
       */
      if(
        state.view ===
        "createWorkOrder"
      ){

        openCreateWorkOrder();

        return;
      }


      /*
       * WORK ORDER
       */
      if(
        state.view ===
        "workOrder" &&
        state.workOrder
      ){

        selectedWorkOrder =
          await api(
            "/api/method/sr_connect.www.home.get_work_order?work_order_id="
            +
            encodeURIComponent(
              state.workOrder
            )
          );

        window.srCreatedWorkOrder =
          selectedWorkOrder;

        localStorage.setItem(
          "sr_current_work_order",
          selectedWorkOrder.name
        );

        renderWorkOrder();

        return;
      }


      /*
       * STOCK TRANSFER
       */
      if(
        state.view ===
        "stockTransfer" &&
        state.workOrder
      ){

        selectedWorkOrder =
          await api(
            "/api/method/sr_connect.www.home.get_work_order?work_order_id="
            +
            encodeURIComponent(
              state.workOrder
            )
          );

        window.srCreatedWorkOrder =
          selectedWorkOrder;

        openWorkOrderStockTransfer();

        return;
      }


      /*
       * ASSIGN EMPLOYEE
       */
      if(
        state.view ===
        "assignEmployee" &&
        state.workOrder
      ){

        selectedWorkOrder =
          await api(
            "/api/method/sr_connect.www.home.get_work_order?work_order_id="
            +
            encodeURIComponent(
              state.workOrder
            )
          );

        window.srCreatedWorkOrder =
          selectedWorkOrder;

        await openWorkOrderAssignEmployee();

        return;
      }


      /*
       * JOB CARD
       */
      if(
        state.view ===
        "job" &&
        state.job
      ){

        await openJob(
          state.job
        );

        return;
      }

    }catch(e){

      console.error(
        "SR Connect history restore failed:",
        e
      );

    }finally{

      srRestoringHistory =
        false;

    }

  }
);

async function srSubmitStockEntry(){

  const select =
    document.getElementById(
      "srStockWO"
    );

  const btn =
    document.getElementById(
      "srStockSubmitBtn"
    );

  if(!select || !select.value){

    alert(
      "Select a Work Order first."
    );

    return;
  }

  const workOrder =
    select.value;

  const payload = [];

  srStockEntryMaterials
    .forEach(
      function(row, index){

        const qtyInput =
          document.getElementById(
            "srStockQty_" +
            index
          );

        const batchInput =
          document.getElementById(
            "srStockBatch_" +
            index
          );

        const qty =
          Number(
            qtyInput &&
            qtyInput.value
              ? qtyInput.value
              : 0
          );

        if(qty > 0){

          const warehouseInput =
            document.getElementById(
              "srStockWarehouse_" +
              index
            );

          payload.push({

            item_code:
              row.item_code,

            qty:
              qty,

            batch_no:
              batchInput
              ? batchInput.value
              : "",

            source_warehouse:
              warehouseInput
              ? warehouseInput.value
              : (
                row.source_warehouse ||
                ""
              )

          });

        }

      }
    );

  if(!payload.length){

    alert(
      "Enter at least one material quantity."
    );

    return;
  }

  if(btn){

    btn.disabled = true;

    btn.innerText =
      "SUBMITTING...";

  }

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.create_stock_entry_from_work_order",
        {
          method:
            "POST",

          body:
            JSON.stringify({
              work_order_id:
                workOrder,

              items:
                payload
            })
        }
      );

    if(result.success){

      alert(
        "✓ Stock Entry submitted successfully.\n\n"
        + result.name
      );

      loadList(
        "Stock Entry"
      );

      return;
    }

    throw new Error(
      result.message ||
      "Stock Entry submission failed."
    );

  }catch(e){

    alert(
      e.message ||
      "Stock Entry submission failed."
    );

  }finally{

    if(btn){

      btn.disabled = false;

      btn.innerText =
        "SUBMIT STOCK ENTRY";

    }

  }

}

      workOrder
    );

  const list =
    document.getElementById(
      "srSEV2BatchList"
    );

  if(list){
    list.innerHTML =
      srSEV2RenderBatches();
  }

}

async function srSEV2SubmitSingle(){

  if(!srSEV2.detail){
    return;
  }

  const result =
    srSEV2.detail;

  const items = [];

  (
    result.materials || []
  )
  .forEach(
    function(row,index){

      const input =
        document.getElementById(
          "srSEV2Qty_" +
          index
        );

      const qty =
        Number(
          input &&
          input.value
            ? input.value
            : 0
        );

      if(qty > 0){

        items.push({
          item_code:
            row.item_code,

          qty:
            qty
        });

      }

    }
  );

  if(!items.length){

    srSEV2ShowMessage(
      "Enter material quantity.",
      false
    );

    return;
  }

  await srSEV2Submit(
    [result.work_order],
    {
      [result.work_order]:
        items
    }
  );

}


async function srSEV2SubmitSelected(){

  const ids =
    Array.from(
      srSEV2.selected
    );

  if(!ids.length){

    srSEV2ShowMessage(
      "Select at least one batch.",
      false
    );

    return;
  }

  const itemsByWorkOrder = {};

  for(
    const id of ids
  ){

    const result =
      await api(
        "/api/method/sr_connect.www.home.sr_stock_entry_detail_v2"
        + "?work_order_id="
        + encodeURIComponent(id)
      );

    const items = [];

    (
      result.materials || []
    )
    .forEach(
      function(row){

        const qty =
          Number(
            row.remaining_qty ||
            0
          );

        if(qty > 0){

          items.push({
            item_code:
              row.item_code,

            qty:
              qty
          });

        }

      }
    );

    if(items.length){

      itemsByWorkOrder[id] =
        items;

    }

  }

  await srSEV2Submit(
    ids,
    itemsByWorkOrder
  );

}


async function srSEV2Submit(
  ids,
  itemsByWorkOrder
){

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.sr_stock_entry_submit_v2",
        {
          method:
            "POST",

          body:
            JSON.stringify({
              work_order_ids:
                ids,

              items_by_work_order:
                itemsByWorkOrder
            })
        }
      );

    srSEV2ShowMessage(
      "✓ " +
      (
        result.message ||
        "Stock Entry submitted successfully."
      ),
      true
    );

    await srOpenStockEntryListV2();

  }catch(e){

    srSEV2ShowMessage(
      e.message ||
      "Stock Entry submission failed.",
      false
    );

  }

}


function srSEV2ShowMessage(
  message,
  success
){

  const box =
    document.getElementById(
      "srSEV2Message"
    );

  if(!box){

    alert(
      message
    );

    return;
  }

  box.className =
    "mt-4 rounded-xl border p-3 text-xs "
    +
    (
      success
        ? "border-emerald-200 bg-emerald-50 text-emerald-700"
        : "border-rose-200 bg-rose-50 text-rose-700"
    );

  box.innerText =
    message;

}

          );

        if(!button){
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        let index =
          Number(
            button.dataset.srItemIndex
          );

        /*
         * Multi-batch card scope.
         * Read the result index from the actual
         * material card instead of using an undefined
         * resultIndex variable.
         */
        const multiCard =
          button.closest(
            '[data-sr-material-card="1"]'
          );

        const resultIndex =
          multiCard &&
          multiCard.getAttribute(
            "data-sr-multi-result"
          ) !== null
            ? Number(
                multiCard.getAttribute(
                  "data-sr-multi-result"
                )
              )
            : null;

        /*
         * Some older material cards do not carry
         * data-sr-item-index. In that case derive the
         * index from the actual material card position.
         */
        if(
          !Number.isFinite(index)
        ){

          const card =
            button.closest(
              '[data-sr-material-card="1"]'
            );

          const cards =
            Array.from(
              document.querySelectorAll(
                '[data-sr-material-card="1"]'
              )
            );

          index =
            card
              ? cards.indexOf(card)
              : -1;

        }

        if(
          index < 0
        ){
          console.warn(
            "SR V3: unable to determine material index"
          );
          return;
        }

        if(
          typeof window.srSEV3DirectItemPicker ===
          "function"
        ){
          window.srSEV3DirectItemPicker(
            index,
            resultIndex
          );
        }

      },
      true
    );

    window._srV3ItemSelectListenerInstalled = true;

  }

  srSEV3InstallItemPicker();

  srSEV3InstallBatchPicker();

  srSEV3RefreshSubmitState();

}









function srSEV3InstallItemPicker(){

  if(
    !srSEV3.detail ||
    !Array.isArray(
      srSEV3.detail.materials
    )
  ){
    return;
  }

  srSEV3.detail.materials.forEach(
    function(row,index){

      const code =
        String(
          row.item_code ||
          row.original_item_code ||
          ""
        ).trim();

      /*
       * IMPORTANT:
       * Resolve this exact material card directly.
       * Never use a DOM array index.
       */
      const card =
        document.getElementById(
          "srSEV3Material_" + index
        );

      if(!card){
        return;
      }

      let host =
        card.querySelector(
          '[data-sr-item-picker="1"]'
        );

      if(host){
        return;
      }

      const oldTitle =
        card.querySelector(
          ".font-bold.text-xs"
        );

      if(!oldTitle){
        return;
      }

      host =
        document.createElement(
          "div"
        );

      host.setAttribute(
        "data-sr-item-picker",
        "1"
      );

      host.className =
        "relative mb-2";

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "w-full border rounded-xl p-3 " +
        "bg-white text-left flex " +
        "items-center justify-between";

      const label =
        document.createElement(
          "span"
        );

      label.className =
        "text-xs font-bold";

      label.textContent =
        row.item_name ||
        row.item_code ||
        "Select Item";

      const arrow =
        document.createElement(
          "span"
        );

      arrow.className =
        "text-slate-400";

      arrow.textContent =
        "▼";

      button.appendChild(label);
      button.appendChild(arrow);

      const panel =
        document.createElement(
          "div"
        );

      panel.className =
        "hidden absolute left-0 right-0 z-[300] " +
        "mt-2 bg-white border rounded-xl " +
        "shadow-xl p-2";

      const search =
        document.createElement(
          "input"
        );

      search.type =
        "text";

      search.placeholder =
        "Search item code / name";

      search.className =
        "w-full border rounded-xl p-3 text-xs mb-2";

      const results =
        document.createElement(
          "div"
        );

      results.className =
        "max-h-64 overflow-y-auto space-y-1";

      panel.appendChild(
        search
      );

      panel.appendChild(
        results
      );

      button.onclick =
        async function(event){

          event.preventDefault();
          event.stopPropagation();

          panel.classList.toggle(
            "hidden"
          );

          if(
            panel.classList.contains(
              "hidden"
            )
          ){
            return;
          }

          results.innerHTML =
            '<div class="p-3 text-xs text-slate-400">' +
            'Loading items...' +
            '</div>';

          try{

            const result =
              await api(
                "/api/method/" +
                "sr_connect.www.home." +
                "sr_stock_item_options_v3" +
                "?item_code=" +
                encodeURIComponent(
                  row.original_item_code ||
                  row.item_code
                )
              );

            const items =
              Array.isArray(
                result.items
              )
                ? result.items
                : [];

            function draw(){

              const q =
                String(
                  search.value || ""
                )
                .toLowerCase()
                .trim();

              const matches =
                items.filter(
                  function(item){

                    return (
                      String(
                        item.name || ""
                      )
                      .toLowerCase()
                      .includes(q)
                    ) ||
                    String(
                      item.item_name || ""
                    )
                    .toLowerCase()
                    .includes(q);

                  }
                );

              results.innerHTML =
                "";

              matches.forEach(
                function(item){

                  const option =
                    document.createElement(
                      "button"
                    );

                  option.type =
                    "button";

                  option.className =
                    "w-full text-left border " +
                    "rounded-xl p-3 bg-white";

                  option.innerHTML =
                    "<div class='text-xs font-bold'>" +
                    escapeHtml(
                      item.item_name ||
                      item.name ||
                      ""
                    ) +
                    "</div>" +
                    "<div class='text-[10px] " +
                    "text-slate-400 mt-1'>" +
                    escapeHtml(
                      item.name || ""
                    ) +
                    "</div>";

                  option.onclick =
                    async function(){

                      const originalCode =
                        String(
                          row.original_item_code ||
                          row.item_code ||
                          ""
                        ).trim();

                      const selectedCode =
                        String(
                          item.name ||
                          ""
                        ).trim();

                      if(
                        !originalCode ||
                        !selectedCode
                      ){
                        return;
                      }

                      /*
                       * Store the actual selected stock item
                       * against the original BOM item.
                       */
                      srSEV3.itemOverrides =
                        srSEV3.itemOverrides ||
                        {};

                      srSEV3.itemOverrides[
                        originalCode
                      ] =
                        selectedCode;

                      /*
                       * Drop any previously selected batch
                       * for either the BOM item or the actual item.
                       */
                      srSEV3.selectedBatches =
                        srSEV3.selectedBatches ||
                        {};

                      delete srSEV3.selectedBatches[
                        originalCode
                      ];

                      delete srSEV3.selectedBatches[
                        String(
                          row.item_code || ""
                        ).trim()
                      ];

                      /*
                       * Keep the selected item in the current
                       * material row so submit cannot fall back
                       * to the original BOM item.
                       */
                      /*
                       * Keep the ORIGINAL BOM item identity.
                       * Only the selected stock item changes.
                       */
                      row.selected_item_code =
                        selectedCode;

                      row.selected_item_name =
                        item.item_name ||
                        item.name ||
                        selectedCode;

                      /*
                       * Do NOT overwrite row.original_item_code.
                       * Do NOT use the old row.item_code as the
                       * selected item's permanent identity.
                       */
                      if(
                        srSEV3.detail &&
                        Array.isArray(
                          srSEV3.detail.materials
                        )
                      ){
                        srSEV3.detail.materials[index] =
                          row;
                      }

                      /*
                       * Store selected item against the original
                       * BOM item.
                       */
                      srSEV3.itemOverrides[
                        originalCode
                      ] = selectedCode;

                      /*
                       * CRITICAL:
                       * Clear the actual batch <select> in THIS
                       * material card. Deleting from JS state alone
                       * is not enough because the DOM can still hold
                       * the previous item's batch.
                       */
                      const materialCard =
                        document.querySelector(
                          '[data-sr-material-card="1"][data-sr-original-item-code="' +
                          CSS.escape(originalCode) +
                          '"]'
                        );

                      if(materialCard){

                        const batchSelect =
                          materialCard.querySelector(
                            '[data-sr-role="batch"]'
                          );

                        if(batchSelect){

                          batchSelect.value = "";

                          batchSelect.selectedIndex = 0;

                          batchSelect.dispatchEvent(
                            new Event(
                              "change",
                              { bubbles:true }
                            )
                          );

                        }

                        const batchInfo =
                          materialCard.querySelector(
                            '[data-sr-batch-selected="1"]'
                          ) ||
                          materialCard.querySelector(
                            '[id^="srSEV3BatchSelected_"]'
                          );

                        if(batchInfo){

                          batchInfo.textContent = "";

                          batchInfo.classList.add(
                            "hidden"
                          );

                        }

                      }

                      /*
                       * IMPORTANT:
                       * Reload the detail after changing the
                       * stock item so the backend rebuilds the
                       * warehouse/batch list for the NEW item.
                       *
                       * itemOverrides is already stored above,
                       * so srSEV3OpenDetail() will preserve the
                       * user's selected item and fetch only its
                       * valid batches.
                       */
                      if(
                        typeof srSEV3OpenDetail === "function" &&
                        srSEV3.detail &&
                        srSEV3.detail.work_order
                      ){

                        await srSEV3OpenDetail(
                          srSEV3.detail.work_order,
                          false
                        );

                      } else if(
                        typeof srSEV3RefreshSubmitState === "function"
                      ){

                        srSEV3RefreshSubmitState();

                      }

                      /*
                       * Keep selected item on the button too.
                       */
                      button.dataset.selectedItem =
                        selectedCode;

                      label.textContent =
                        row.selected_item_name ||
                        selectedCode;

                      panel.classList.add(
                        "hidden"
                      );

                      /*
                       * Refresh validation only.
                       * The user must now explicitly choose a batch
                       * for the newly selected item.
                       */
                      if(
                        typeof srSEV3RefreshSubmitState ===
                        "function"
                      ){
                        srSEV3RefreshSubmitState();
                      }

                    };

                }
              );

              if(!matches.length){

                results.innerHTML =
                  '<div class="p-3 text-xs text-slate-400">' +
                  'No matching item.' +
                  '</div>';

              }

            }

            search.oninput =
              draw;

            draw();
            search.focus();

          }catch(e){

            results.innerHTML =
              '<div class="p-3 text-xs text-rose-600">' +
              escapeHtml(
                e.message ||
                "Unable to load items."
              ) +
              '</div>';

          }

        };

      host.appendChild(
        button
      );

      host.appendChild(
        panel
      );

      oldTitle.parentNode.replaceChild(
        host,
        oldTitle
      );

    }
  );

}

function srSEV3RefreshLiveBatchStock(){
  if(!Array.isArray(srSEV3.multiDetails)) return;

  const reservations={};

  document.querySelectorAll("[data-sr-multi-section]").forEach(function(section){
    const ri=Number(section.getAttribute("data-sr-multi-section"));
    const detail=srSEV3.multiDetails[ri];
    if(!detail || !Array.isArray(detail.materials)) return;

    const cards=section.querySelectorAll("[data-sr-material-card=\"1\"]");

    cards.forEach(function(card,index){
      const row=detail.materials[index];
      const batch=card.querySelector("[data-sr-role=\"batch\"]");
      const warehouse=card.querySelector("[data-sr-role=\"warehouse\"]");

      if(!row || !batch || !batch.value) return;

      const item=String(
        card.getAttribute("data-sr-item-code") ||
        row.item_code ||
        ""
      ).trim();

      const wh=String(
        (warehouse && warehouse.value) ||
        row.source_warehouse ||
        ""
      ).trim();

      const bn=String(batch.value).trim();
      const key=item+"|"+wh+"|"+bn;

      reservations[key]=
        Number(reservations[key] || 0) +
        Number(row.remaining_qty || 0);
    });
  });

  document.querySelectorAll("[data-sr-multi-section]").forEach(function(section){
    const ri=Number(section.getAttribute("data-sr-multi-section"));
    const detail=srSEV3.multiDetails[ri];
    if(!detail || !Array.isArray(detail.materials)) return;

    const cards=section.querySelectorAll("[data-sr-material-card=\"1\"]");

    cards.forEach(function(card,index){
      const row=detail.materials[index];
      const batch=card.querySelector("[data-sr-role=\"batch\"]");
      const warehouse=card.querySelector("[data-sr-role=\"warehouse\"]");

      if(!row || !batch) return;

      const item=String(
        card.getAttribute("data-sr-item-code") ||
        row.item_code ||
        ""
      ).trim();

      const wh=String(
        (warehouse && warehouse.value) ||
        row.source_warehouse ||
        ""
      ).trim();

      Array.from(batch.options).forEach(function(option){
        const bn=String(option.value || "").trim();
        if(!bn) return;

        const source=Array.isArray(row.batches)
          ? row.batches.find(function(x){
              return String(x.batch_no || "").trim()===bn;
            })
          : null;

        if(!source) return;

        const key=item+"|"+wh+"|"+bn;
        const totalReserved=Number(reservations[key] || 0);

        const available=
          Math.max(
            0,
            Number(source.available_qty || 0)-totalReserved
          );

        option.textContent=
          bn+" — "+available+" "+String(row.stock_uom || "");
      });

      const selected=String(batch.value || "").trim();

      if(selected){
        const key=item+"|"+wh+"|"+selected;
        const totalReserved=Number(reservations[key] || 0);
        const source=Array.isArray(row.batches)
          ? row.batches.find(function(x){
              return String(x.batch_no || "").trim()===selected;
            })
          : null;

        if(source){
          const available=
            Math.max(
              0,
              Number(source.available_qty || 0)-totalReserved
            );

          const option=batch.querySelector(
            "option[value=\""+CSS.escape(selected)+"\"]"
          );

          if(option){
            option.textContent=
              selected+" — "+available+" "+String(row.stock_uom || "");
          }

          const availableBox=card.querySelector('[data-sr-live-available="1"]');
          if(availableBox){
            availableBox.textContent=available+" "+String(row.stock_uom || "");
          }
        }
      }
    });
  });
}

document.addEventListener("change", function(event){
  const select=event.target;
  if(!select || !select.matches("[data-sr-role=\"batch\"]")) return;
  if(!select.closest("[data-sr-multi-section]")) return;
  srSEV3BatchChangedElement(select);
});

function srSEV3BatchChangedElement(
  select
){

  if(!select){
    return;
  }

  const value =
    String(
      select.value || ""
    ).trim();

  const card =
    select.closest(
      '[data-sr-material-card="1"]'
    );

  if(card){

    const originalCode =
      String(
        card.dataset.srOriginalItemCode ||
        ""
      ).trim();

    /*
     * IMPORTANT:
     * Batch selection belongs to the ORIGINAL BOM item.
     * Never keep one shared/global selected batch.
     */
    srSEV3.selectedBatches =
      srSEV3.selectedBatches ||
      {};

    if(originalCode){

      if(value){

        srSEV3.selectedBatches[
          originalCode
        ] = value;

      }else{

        delete srSEV3.selectedBatches[
          originalCode
        ];

      }

    }

    const info =
      card.querySelector(
        '[data-sr-batch-selected="1"]'
      );

    if(info){

      if(value){

        info.textContent =
          "Selected batch: " + value;

        info.classList.remove(
          "hidden"
        );

      }else{

        info.textContent =
          "";

        info.classList.add(
          "hidden"
        );

      }

    }

  }

  srSEV3RefreshLiveBatchStock();

  srSEV3RefreshSubmitState();

}


function srSEV3WarehouseChangedElement(

  }

function srSEV3BatchChanged(
  index,
  value
){

      Array.isArray(srSEV3.detail.materials)
        ? srSEV3.detail.materials
        : []
    )[index];

  if(!row){

        document.getElementById(
          "srSEV3CleanBatch_" + index
        ) ||
        document.getElementById(

        ) ||
        {}
      ).value ||
      ""
    ).trim();

  const info =
    document.getElementById(

  if(info){

      info.classList.remove("hidden");

    }else{

      info.classList.add("hidden");

    }

}

function srSEV3RefreshSubmitState(){

  const button =
    document.getElementById(
      "srSEV3SubmitButton"
    );

  const info =
    document.getElementById(
      "srSEV3SubmitInfo"
    );

  if(
    !button ||
    !srSEV3.detail ||
    !Array.isArray(
      srSEV3.detail.materials
    )
  ){
    return;
  }

  let ok = true;
  const problems = [];

  srSEV3.detail.materials.forEach(
    function(row,index){

      const code =
        String(
          row.item_code ||
          row.original_item_code ||
          ""
        ).trim();

      const originalItemCode =
        String(
          row.original_item_code ||
          row.item_code ||
          ""
        ).trim();

      /*
       * IMPORTANT:
       * This card belongs to the original WO material.
       * Selected alternative item must NOT change the card
       * identity.
       */
      const card =
        document.querySelector(
          '[data-sr-material-card="1"][data-sr-original-item-code="' +
          CSS.escape(originalItemCode) +
          '"]'
        ) ||
        document.getElementById(
          "srSEV3Material_" + index
        );

      const label =
        String(
          row.item_name ||
          row.item_code ||
          ("Material " + (index + 1))
        );

      if(!card){

        ok = false;

        problems.push(
          label +
          ": material card not found"
        );

        return;
      }

      const warehouse =
        card.querySelector(
          '[data-sr-role="warehouse"]'
        );

      let sourceWarehouse =
        warehouse
          ? String(
              warehouse.value || ""
            ).trim()
          : "";

      if(
        !sourceWarehouse &&
        row.source_warehouse
      ){

        sourceWarehouse =
          String(
            row.source_warehouse
          ).trim();

        if(warehouse){
          warehouse.value =
            sourceWarehouse;
        }

      }

      if(!sourceWarehouse){

        ok = false;

        problems.push(
          label +
          ": select warehouse"
        );

        return;
      }

      const warehouseData =
        (
          row.warehouse_options ||
          []
        ).find(
          function(wh){

            return String(
              wh.warehouse || ""
            ).trim() ===
            sourceWarehouse;

          }
        );

      if(!warehouseData){

        ok = false;

        problems.push(
          label +
          ": warehouse data not found"
        );

        return;
      }

      const required =
        Number(
          row.remaining_qty || 0
        );

      if(required <= 0){
        return;
      }

      if(
        Number(
          row.has_batch_no || 0
        ) === 1
      ){

        const batch =
          card.querySelector(
            '[data-sr-role="batch"]'
          );

        const batchValue =
          batch
            ? String(
                batch.value || ""
              ).trim()
            : "";

        if(!batchValue){

          ok = false;

          problems.push(
            label +
            ": select batch"
          );

          return;
        }

        const batchData =
          (
            warehouseData.batches ||
            []
          ).find(
            function(b){

              return String(
                b.batch_no || ""
              ).trim() ===
              batchValue;

            }
          );

        if(!batchData){

          ok = false;

          problems.push(
            label +
            ": batch " +
            batchValue +
            " not in " +
            sourceWarehouse
          );

          return;
        }

        if(
          Number(
            batchData.available_qty || 0
          ) < required
        ){

          ok = false;

          problems.push(
            label +
            ": batch " +
            batchValue +
            " insufficient"
          );

        }

      }else{

        if(
          Number(
            warehouseData.available_qty || 0
          ) < required
        ){

          ok = false;

          problems.push(
            label +
            ": stock insufficient"
          );

        }

      }

    }
  );

  button.hidden = false;
  button.style.display = "block";
  button.style.visibility = "visible";

  button.disabled =
    !ok;

  button.classList.toggle(
    "opacity-50",
    !ok
  );

  button.classList.toggle(
    "cursor-not-allowed",
    !ok
  );

  if(info){

    info.textContent =
      ok
        ? "All materials are ready. You can submit the Stock Entry."
        : (
            problems.length
              ? problems.join(" • ")
              : "Complete all material selections."
          );

  }

}


async function srSEV3SubmitSingle(){

  if(
    !srSEV3.detail ||
    !Array.isArray(
      srSEV3.detail.materials
    )
  ){
    return;
  }

  const button =
    document.getElementById(
      "srSEV3SubmitButton"
    );

  srSEV3RefreshSubmitState();

  if(
    !button ||
    button.disabled
  ){
    alert(
      "Please complete all warehouse and batch selections."
    );
    return;
  }

  const materials = [];
  let invalid = false;

  /*
   * IMPORTANT:
   * Do not collect material cards by DOM order.
   * Each card is permanently bound to its original WO item.
   */
  srSEV3.detail.materials.forEach(
    function(row,index){

      const originalItemCode =
        String(
          row.original_item_code ||
          row.item_code ||
          ""
        ).trim();

      const selectedItem =
        String(
          (
            srSEV3.itemOverrides &&
            srSEV3.itemOverrides[
              originalItemCode
            ]
          ) ||
          row.item_code ||
          ""
        ).trim();

      /*
       * IMPORTANT:
       * The card belongs to the ORIGINAL WO material.
       * The selected alternative item may be different.
       *
       * Example:
       *   Original: MAIZE STARCH
       *   Selected: another Starch type
       *
       * We must still read the warehouse/batch from the
       * MAIZE STARCH card itself.
       */
      const card =
        document.querySelector(
          '[data-sr-material-card="1"][data-sr-original-item-code="' +
          CSS.escape(originalItemCode) +
          '"]'
        );

      /*
       * Safety fallback: if an old browser/DOM does not expose
       * the attribute, use the exact material ID.
       */
      const resolvedCard =
        card ||
        document.getElementById(
          "srSEV3Material_" + index
        );

      const materialCard = resolvedCard;

      if(!materialCard){
        invalid = true;
        console.error(
          "SR V3: material card not found",
          {
            index:index,
            original_item_code:originalItemCode,
            selected_item:selectedItem
          }
        );
        return;
      }

      /*
       * Verify the card really belongs to this material.
       * This prevents an incorrect card/batch pairing.
       */
      const cardItem =
        String(
          materialCard.getAttribute(
            "data-sr-original-item-code"
          ) ||
          ""
        ).trim();

      if(
        cardItem &&
        cardItem !== originalItemCode
      ){
        invalid = true;

        console.error(
          "SR V3: material/card mismatch",
          {
            index:index,
            expected:originalItemCode,
            actual:cardItem
          }
        );

        return;
      }

      const warehouse =
        materialCard.querySelector(
          '[data-sr-role="warehouse"]'
        );

      const sourceWarehouse =
        warehouse
          ? String(
              warehouse.value || ""
            ).trim()
          : String(
              row.source_warehouse || ""
            ).trim();

      const required =
        Number(
          row.remaining_qty || 0
        );

      if(
        !originalItemCode ||
        !selectedItem ||
        !sourceWarehouse ||
        required <= 0
      ){
        invalid = true;
        return;
      }

      let batchNo = "";

      if(
        Number(
          row.has_batch_no || 0
        ) === 1
      ){

        /*
         * Batch MUST come from this material card only.
         */
        /*
         * FINAL BATCH RESOLUTION
         *
         * Never trust a batch value left in the DOM.
         * The batch MUST exist in THIS row's current backend
         * batch list AND in THIS row's selected warehouse.
         */
        const validBatches =
          Array.isArray(row.batches)
            ? row.batches
            : [];

        const warehouseData =
          (
            row.warehouse_options ||
            []
          ).find(function(wh){
            return String(
              wh.warehouse || ""
            ).trim() === sourceWarehouse;
          });

        const warehouseBatches =
          warehouseData &&
          Array.isArray(warehouseData.batches)
            ? warehouseData.batches
            : [];

        const batch =
          materialCard.querySelector(
            '[data-sr-role="batch"]'
          );

        const domBatch =
          batch
            ? String(batch.value || "").trim()
            : "";

        const validBatch =
          validBatches.find(function(b){
            return String(
              b.batch_no || ""
            ).trim() === domBatch;
          });

        const validWarehouseBatch =
          warehouseBatches.find(function(b){
            return String(
              b.batch_no || ""
            ).trim() === domBatch;
          });

        /*
         * If DOM contains a batch which does not belong to
         * this material, STOP. Do not put it into payload.
         */
        if(
          !domBatch ||
          !validBatch ||
          !validWarehouseBatch
        ){

          invalid = true;

          console.error(
            "SR V3 FINAL BATCH MISMATCH",
            {
              index:index,
              original_item_code:originalItemCode,
              selected_item:selectedItem,
              warehouse:sourceWarehouse,
              dom_batch:domBatch,
              row_valid_batches:
                validBatches.map(function(b){
                  return b.batch_no;
                }),
              warehouse_valid_batches:
                warehouseBatches.map(function(b){
                  return b.batch_no;
                })
            }
          );

          return;
        }

        /*
         * IMPORTANT:
         * Only this verified batch is allowed into payload.
         */
        batchNo =
          String(
            validWarehouseBatch.batch_no
          ).trim();
      }

      console.log(
        "SR V3 SUBMIT ROW",
        {
          index:index,
          original_item_code:
            originalItemCode,
          item_code:
            selectedItem,
          warehouse:
            sourceWarehouse,
          batch_no:
            batchNo,
          qty:
            required
        }
      );

      materials.push({

        original_item_code:
          originalItemCode,

        item_code:
          selectedItem,

        qty:
          required,

        batch_no:
          batchNo,

        source_warehouse:
          sourceWarehouse

      });

    }
  );

  if(
    invalid ||
    materials.length !==
      srSEV3.detail.materials.length
  ){
    alert(
      "Please complete all required materials."
    );
    return;
  }

  console.log(
    "STOCK ENTRY PAYLOAD",
    JSON.stringify(
      materials,
      null,
      2
    )
  );

  button.disabled = true;

  button.innerText =
    "SUBMITTING...";

  try{

    const result =
      await api(
        "/api/method/" +
        "sr_connect.www.home." +
        "create_stock_entry_from_work_order",
        {
          method: "POST",
          body:
            JSON.stringify({
              work_order_id:
                srSEV3.detail.work_order,

              items:
                materials
            })
        }
      );

    const stockEntry =
      result &&
      (
        result.stock_entry ||
        result.name ||
        result.stock_entry_name
      );

    alert(
      stockEntry
        ? "Stock Entry created: " + stockEntry
        : "Stock Entry submitted successfully."
    );

    await srSEV3OpenDetail(
      srSEV3.detail.work_order,
      false
    );

  }catch(e){

    button.disabled = false;

    button.innerText =
      "SAVE & SUBMIT";

    alert(
      e &&
      e.message
        ? e.message
        : "Unable to submit Stock Entry."
    );

  }

}

function srWarehouseBatches(
  row,
  warehouse
){

  const list =
    Array.isArray(
      row.warehouse_options
    )
      ? row.warehouse_options
      : [];

  const found =
    list.find(
      function(item){
        return String(
          item.warehouse || ""
        ) === String(
          warehouse || ""
        );
      }
    );

  return (
    found &&
    Array.isArray(found.batches)
  )
    ? found.batches
    : [];
}


function srRefreshWarehouseBatchesV3(
  index
){

  const row =
    srStockEntryMaterials[index];

  if(!row){
    return;
  }

  const warehouse =
    document.getElementById(
      "srStockWarehouse_" +
      index
    );

  const batch =
    document.getElementById(
      "srStockBatch_" +
      index
    );

  const available =
    document.getElementById(
      "srStockAvailable_" +
      index
    );

  if(!warehouse || !batch){
    return;
  }

  const batches =
    srWarehouseBatches(
      row,
      warehouse.value
    );

  batch.innerHTML =
    '<option value="">Select Batch</option>'
    +
    batches.map(
      function(item){

        return `
          <option
            value="${escapeAttr(
              item.batch_no
            )}"
          >
            ${escapeHtml(
              item.batch_no
            )}
            — ${formatQty(
              item.available_qty
            )} ${escapeHtml(
              row.stock_uom || ""
            )}
          </option>
        `;

      }
    ).join("");

  if(available){
    available.innerText = "0";
  }

  batch.onchange =
    function(){

      const selected =
        batches.find(
          function(item){
            return String(
              item.batch_no || ""
            ) === String(
              batch.value || ""
            );
          }
        );

      available.innerText =
        selected
          ? formatQty(
              selected.available_qty
            )
          : "0";

    };
}


function srInstallWarehouseSelectorV3(){

  if(
    !Array.isArray(
      srStockEntryMaterials
    )
  ){
    return;
  }

  srStockEntryMaterials.forEach(
    function(row,index){

      const batch =
        document.getElementById(
          "srStockBatch_" +
          index
        );

      if(!batch){
        return;
      }

      let warehouse =
        document.getElementById(
          "srStockWarehouse_" +
          index
        );

      if(!warehouse){

        warehouse =
          document.createElement(
            "select"
          );

        warehouse.id =
          "srStockWarehouse_" +
          index;

        warehouse.className =
          "w-full border rounded-xl p-3 text-xs bg-white mb-3";

        const label =
          document.createElement(
            "div"
          );

        label.className =
          "text-[9px] text-slate-400 uppercase mb-1";

        label.innerText =
          "SOURCE WAREHOUSE";

        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "mt-3";

        wrapper.appendChild(
          label
        );

        wrapper.appendChild(
          warehouse
        );

        batch.parentNode.insertBefore(
          wrapper,
          batch
        );

      }

      const options =
        Array.isArray(
          row.warehouse_options
        )
          ? row.warehouse_options
          : [];

      const current =
        row.source_warehouse ||
        (
          options[0]
            ? options[0].warehouse
            : ""
        );

      warehouse.innerHTML =
        '<option value="">Select Warehouse</option>'
        +
        options.map(
          function(item){

            return `
              <option
                value="${escapeAttr(
                  item.warehouse
                )}"
                ${
                  String(
                    item.warehouse
                  ) === String(
                    current
                  )
                    ? "selected"
                    : ""
                }
              >
                ${escapeHtml(
                  item.warehouse
                )}
                — ${formatQty(
                  item.available_qty
                )} ${escapeHtml(
                  row.stock_uom || ""
                )}
              </option>
            `;

          }
        ).join("");

      if(
        warehouse.dataset.srBound !== "1"
      ){

        warehouse.dataset.srBound =
          "1";

        warehouse.onchange =
          function(){

            srRefreshWarehouseBatchesV3(
              index
            );

          };

      }

    }
  );
}
