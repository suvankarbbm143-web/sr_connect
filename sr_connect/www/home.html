let srERPItemSearchTimer = null;


async function searchERPItems(query){

  const results =
    document.getElementById(
      "woItemResults"
    );

  const hidden =
    document.getElementById(
      "woProductionItem"
    );

  if(!results || !hidden){
    return;
  }

  clearTimeout(
    srERPItemSearchTimer
  );

  query =
    String(query || "")
      .trim();

  hidden.value = "";

  if(!query){

    results.innerHTML = "";

    results.classList.add(
      "hidden"
    );

    return;
  }

  srERPItemSearchTimer =
    setTimeout(
      async function(){

        results.classList.remove(
          "hidden"
        );

        results.innerHTML =
          '<div class="p-3 text-xs text-slate-400">'
          + 'Searching ERPNext...'
          + '</div>';

        try{

          const response =
            await fetch(
              "/api/method/frappe.desk.search.search_link"
              + "?doctype=Item"
              + "&txt="
              + encodeURIComponent(query)
              + "&page_length=20",
              {
                method:"GET",
                headers:{
                  "X-Frappe-CSRF-Token":
                    "{{ csrf_token }}"
                }
              }
            );

          const data =
            await response.json();

          if(
            !response.ok ||
            data.exc
          ){

            throw new Error(
              data.exception ||
              data.exc ||
              "ERPNext Item search failed"
            );

          }

          const rows =
            Array.isArray(data.message)
              ? data.message
              : [];

          if(!rows.length){

            results.innerHTML =
              '<div class="p-3 text-xs text-slate-400">'
              + 'No matching Item found.'
              + '</div>';

            return;
          }

          results.innerHTML =
            rows.map(function(row){

              const code =
                row.value ||
                row.name ||
                "";

              const label =
                row.description ||
                row.item_name ||
                code;

              return `
                <button
                  type="button"
                  onclick="selectERPItem(
                    '${escapeAttr(code)}',
                    '${escapeAttr(label)}'
                  )"
                  class="w-full text-left px-3 py-3
                         border-b last:border-b-0
                         hover:bg-slate-50"
                >

                  <div class="text-xs font-bold">
                    ${escapeHtml(label)}
                  </div>

                  ${
                    code !== label
                    ? `
                      <div class="text-[10px] text-slate-400 mt-1">
                        ${escapeHtml(code)}
                      </div>
                    `
                    : ""
                  }

                </button>
              `;

            }).join("");

        }catch(e){

          console.error(
            "ERP Item search failed:",
            e
          );

          results.innerHTML =
            '<div class="p-3 text-xs text-rose-500">'
            + escapeHtml(
                e.message ||
                "Unable to search ERPNext Items"
              )
            + '</div>';

        }

      },
      250
    );
}


async function selectERPItem(
  itemCode,
  itemLabel
){

  const hidden =
    document.getElementById("woProductionItem");

  const search =
    document.getElementById("woProductionItemSearch");

  const results =
    document.getElementById("woItemResults");

  const shelf =
    document.getElementById("woShelfLife");

  const exp =
    document.getElementById("woExpDate");

  if(hidden){
    hidden.value = itemCode || "";
  }

  if(search){
    search.value =
      itemLabel || itemCode || "";
  }

  if(results){
    results.classList.add("hidden");
    results.innerHTML = "";
  }

  if(shelf){
    shelf.value = "Loading...";
  }

  if(exp){
    exp.value = "";
  }

  try{

    const response =
      await fetch(
        "/api/method/frappe.client.get_value" +
        "?doctype=Item" +
        "&fieldname=" +
        encodeURIComponent(
          JSON.stringify(["shelf_lifemonths"])
        ) +
        "&filters=" +
        encodeURIComponent(
          JSON.stringify([
            ["Item", "name", "=", itemCode || ""]
          ])
        ),
        {
          credentials: "same-origin"
        }
      );

    const data =
      await response.json();

    const months =
      Number(
        data?.message?.shelf_lifemonths || 0
      );

    if(shelf){
      shelf.value =
        months > 0
          ? months + " Months"
          : "No Shelf Life";
    }

    /*
     * Keep existing BOM behaviour.
     * Do not let BOM loading control Shelf Life.
     */
    await loadWorkOrderBOMs();

    /*
     * Re-read the selected Item/date after BOM loading.
     * This guarantees initial Item selection calculates EXP
     * without requiring the user to change MFG Date.
     */
    const selectedItem =
      String(
        document.getElementById("woProductionItem")?.value || ""
      ).trim();

    const currentMfg =
      String(
        document.getElementById("woDate")?.value || ""
      ).trim();

    if(
      selectedItem &&
      currentMfg &&
      exp
    ){
      await refreshWorkOrderExpiry();
    }

  }catch(error){

    console.error(
      "Shelf Life load failed:",
      error
    );

    if(shelf){
      shelf.value = "No Shelf Life";
    }

    if(exp){
      exp.value = "";
    }

    /*
     * BOM must continue working even if Shelf Life fails.
     */
    await loadWorkOrderBOMs();

  }

}

async function refreshWorkOrderExpiry(){

  const item =
    String(
      document.getElementById("woProductionItem")?.value || ""
    ).trim();

  const mfg =
    String(
      document.getElementById("woDate")?.value || ""
    ).trim();

  const exp =
    document.getElementById("woExpDate");

  const shelf =
    document.getElementById("woShelfLife");

  if(!exp){
    return;
  }

  if(!item || !mfg){

    exp.value = "";

    return;
  }

  try{

    const response =
      await fetch(
        "/api/method/frappe.client.get_value" +
        "?doctype=Item" +
        "&fieldname=" +
        encodeURIComponent(
          JSON.stringify(["shelf_lifemonths"])
        ) +
        "&filters=" +
        encodeURIComponent(
          JSON.stringify([
            ["Item", "name", "=", item]
          ])
        ),
        {
          credentials: "same-origin"
        }
      );

    const data =
      await response.json();

    const months =
      Number(
        data?.message?.shelf_lifemonths || 0
      );

    if(shelf){

      shelf.value =
        months > 0
          ? months + " Months"
          : "No Shelf Life";

    }

    if(months <= 0){

      exp.value = "";

      return;
    }

    const parts =
      mfg.split("-");

    const year =
      Number(parts[0]);

    const month =
      Number(parts[1]);

    const day =
      Number(parts[2]);

    if(
      parts.length !== 3 ||
      !year ||
      !month ||
      !day
    ){

      exp.value = "";

      return;
    }

    const target =
      new Date(
        year,
        month - 1 + months,
        1
      );

    const lastDay =
      new Date(
        target.getFullYear(),
        target.getMonth() + 1,
        0
      ).getDate();

    const finalDay =
      Math.min(
        day,
        lastDay
      );

    exp.value =
      target.getFullYear() +
      "-" +
      String(
        target.getMonth() + 1
      ).padStart(2, "0") +
      "-" +
      String(finalDay).padStart(2, "0");

  }catch(error){

    console.error(
      "Web EXP calculation failed:",
      error
    );

    exp.value = "";

  }

}


async function loadWorkOrderBOMs(){

  const item =
    document
      .getElementById("woProductionItem")
      .value
      .trim();

  const select =
    document.getElementById("woBOM");

  if(!select){
    return;
  }

  select.innerHTML =
    '<option value="">Loading BOM...</option>';

  if(!item){

    select.innerHTML =
      '<option value="">Select BOM</option>';

    return;
  }

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.get_work_order_create_data"
        + "?production_item="
        + encodeURIComponent(item)
      );

    const boms =
      result.items || [];

    select.innerHTML =
      '<option value="">Select BOM</option>' +
      boms.map(b => `
        <option value="${escapeAttr(b.name)}">
          ${escapeHtml(b.name)}
          ${b.is_default ? " — Default" : ""}
        </option>
      `).join("");

    /*
     * If ERPNext has exactly one/default BOM,
     * select it automatically.
     */
    const defaultBom =
      boms.find(
        b => Number(b.is_default) === 1
      ) || (
        boms.length === 1
          ? boms[0]
          : null
      );

    if(defaultBom){

      select.value =
        defaultBom.name;

      await refreshWorkOrderPreview();
    }

  }catch(e){

    select.innerHTML =
      '<option value="">BOM not found</option>';

    console.error(
      "BOM load failed",
      e
    );
  }
}


async function refreshWorkOrderPreview(){

  const box =
    document.getElementById(
      "woRequiredItems"
    );

  if(!box){
    return;
  }

  const item =
    document.getElementById(
      "woProductionItem"
    ).value.trim();

  const bom =
    document.getElementById(
      "woBOM"
    ).value.trim();

  const qty =
    Number(
      document.getElementById(
        "woQty"
      ).value
    );

  if(!item || !bom || !qty || qty <= 0){

    box.innerHTML =
      '<div class="p-3 rounded-xl bg-slate-50 border text-[10px] text-slate-400">'
      + 'Select Item, BOM and Qty.'
      + '</div>';

    return;
  }

  box.innerHTML =
    '<div class="p-3 rounded-xl bg-slate-50 border text-[10px] text-slate-400">'
    + 'ERPNext calculating required materials...'
    + '</div>';

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.preview_work_order_materials"
        + "?production_item="
        + encodeURIComponent(item)
        + "&bom_no="
        + encodeURIComponent(bom)
        + "&qty="
        + encodeURIComponent(qty)
      );

    const rows =
      result.items || [];

    if(!rows.length){

      box.innerHTML =
        '<div class="p-3 rounded-xl bg-amber-50 border text-[10px] text-amber-700">'
        + 'ERPNext returned no Required Items.'
        + '</div>';

      return;
    }

    box.innerHTML = `
      <div class="font-bold text-xs mb-2">
        ERPNext Required Materials
      </div>

      <div class="border rounded-xl overflow-hidden">
        ${rows.map(row => `
          <div class="px-3 py-2 border-b last:border-b-0 text-[10px]">
            <div class="font-bold">
              ${escapeHtml(row.item_name || row.item_code)}
            </div>

            <div class="text-slate-500 mt-1">
              ${escapeHtml(row.item_code || "")}
              · Required:
              <b>${escapeHtml(formatQty(row.required_qty))}</b>
              ${escapeHtml(row.stock_uom || row.uom || "")}
            </div>

            ${
              row.operation
              ? `<div class="text-slate-400 mt-1">
                   Operation:
                   ${escapeHtml(row.operation)}
                 </div>`
              : ""
            }
          </div>
        `).join("")}
      </div>
    `;

  }catch(e){

    box.innerHTML =
      '<div class="p-3 rounded-xl bg-rose-50 border text-[10px] text-rose-600">'
      + escapeHtml(e.message)
      + '</div>';
  }
}


async function getLatestWorkOrderBatch(){

  const item =
    document.getElementById(
      "woProductionItem"
    ).value.trim();

  const box =
    document.getElementById(
      "woLatestBatch"
    );

  if(!item){

    alert(
      "Select Item to Manufacture first"
    );

    return;
  }

  box.classList.remove("hidden");

  box.innerHTML =
    '<div class="text-xs text-slate-400">Loading latest batch...</div>';

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.get_latest_work_order_new_batch"
        + "?production_item="
        + encodeURIComponent(item)
      );

    if(!result.batch_no){

      box.innerHTML =
        '<div class="text-xs text-slate-400">'
        + 'No previous batch found for this item.'
        + '</div>';

      return;
    }

    box.innerHTML = `
      <div class="text-[10px] text-slate-400">
        LATEST BATCH
      </div>

      <div class="font-bold text-sm mt-1">
        ${escapeHtml(result.batch_no)}
      </div>

      ${
        result.work_order
        ? `
          <div class="text-[10px] text-slate-500 mt-1">
            From Work Order:
            <b>${escapeHtml(result.work_order)}</b>
          </div>
        `
        : ""
      }

      ${
        result.batch
        ? `
          <div class="text-[10px] text-slate-500 mt-1">
            Batch Qty:
            ${escapeHtml(formatQty(result.batch.batch_qty))}
            · Produced:
            ${escapeHtml(formatQty(result.batch.produced_qty))}
          </div>
        `
        : ""
      }
    `;

  }catch(e){

    box.innerHTML =
      '<div class="text-xs text-rose-500">'
      + escapeHtml(e.message)
      + '</div>';
  }
}


async function saveCreateWorkOrder(
  submit=false
){

  const item =
    document.getElementById(
      "woProductionItem"
    ).value.trim();

  const bom =
    document.getElementById(
      "woBOM"
    ).value.trim();

  const qty =
    Number(
      document.getElementById(
        "woQty"
      ).value
    );

  const labour =
    Number(
      document.getElementById(
        "woLabourQty"
      ).value
    ) || 0;

  const date =
    document.getElementById(
      "woDate"
    ).value;

  const batch =
    document.getElementById(
      "woNewBatch"
    ).value.trim();

  if(!item){
    alert("Select Item to Manufacture.");
    return;
  }

  if(!bom){
    alert("Select BOM.");
    return;
  }

  if(!qty || qty <= 0){
    alert("Enter Qty to Manufacture.");
    return;
  }

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.create_work_order_from_sr",
        {
          method:"POST",
          body:JSON.stringify({
            production_item:item,
            bom_no:bom,
            qty:qty,
            labour_qty:labour,
            posting_date:date,
            new_batch_no:batch,
            submit:submit ? 1 : 0
          })
        }
      );

    if(!result.success){

      throw new Error(
        result.error ||
        "Work Order creation failed"
      );

    }

    /*
     * Save only:
     */
    if(!submit){

      alert(
        "Work Order saved: " +
        result.name
      );

      return;

    }

    /*
     * Submit success.
     * Do NOT immediately return to list.
     * Show NEXT workflow.
     */

    window.srCreatedWorkOrder = {
      name: result.name,
      production_item:
        result.production_item || item,
      item_name:
        result.item_name || "",
      bom_no:
        result.bom_no || bom,
      qty:
        Number(result.qty || qty),
      labour_qty:
        Number(
          result.labour_qty ||
          labour ||
          0
        ),
      batch_no:
        result.batch_no || batch,
      required_items:
        result.required_items || [],
      operations:
        result.operations || []
    };

    showWorkOrderNextStep();

  }catch(e){

    console.error(
      "Create Work Order Error:",
      e
    );

    alert(
      e.message ||
      "Work Order creation failed"
    );
  }

}

    return;
  }

  box.classList.remove(
    "hidden"
  );

  currentView =
    "workOrder";


  const wo =
    window.srCreatedWorkOrder;

    "workOrder",

document.getElementById(

        )}

      <div class="mt-5">

        <div class="font-bold text-sm mb-2">
          ERPNext Required Items
        </div>

        <div class="border rounded-xl overflow-hidden">

          ${
            wo.required_items.length
            ? wo.required_items.map(
                function(row){

                  return `

                    ">

                      <div class="text-xs font-bold">
                        ${escapeHtml(
                          row.item_name ||

                          "-"

                      </div>

                      <div class="text-[10px] text-slate-500 mt-1">

                          formatQty(

                  `;

                }
              ).join("")
            : `

async function openWorkOrderAssignEmployee(){

  const source =
    selectedWorkOrder ||
    window.srCreatedWorkOrder;

  if(!source || !source.name){

    alert(
      "Work Order not found."
    );

    return;
  }

  let wo;

  try{

    wo = await api(
      "/api/method/sr_connect.www.home.get_work_order"
      + "?work_order_id="
      + encodeURIComponent(
          source.name
        )
    );

  }catch(e){

    alert(
      e.message ||
      "Unable to load Work Order."
    );

    return;
  }

  selectedWorkOrder =
    wo;

  window.srCreatedWorkOrder =
    wo;

  hideAll();

  const box =
    document.getElementById(
      "workOrderView"
    );

  if(!box){
    return;
  }

  box.classList.remove(
    "hidden"
  );

  if(
    typeof window.removeWorkOrderCreateButton ===
    "function"
  ){

    window.removeWorkOrderCreateButton();

  }

  currentView =
    "assignEmployee";

  localStorage.setItem(
    "sr_page_view",
    "assignEmployee"
  );

  localStorage.setItem(
    "sr_current_work_order",
    wo.name
  );

  document.getElementById(
    "pageTitle"
  ).innerText =
    "Job Cards";

  document.getElementById(
    "pageSub"
  ).innerText =
    wo.name || "";

  document.getElementById(
    "backBtn"
  ).classList.remove(
    "hidden"
  );

  let jobs = [];

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.get_work_order_job_cards"
        + "?work_order_id="
        + encodeURIComponent(
            wo.name
          )
      );

    jobs =
      Array.isArray(
        result.job_cards
      )
        ? result.job_cards
        : [];

  }catch(e){

    console.error(
      "Job Card loading failed:",
      e
    );

  }

  if(!jobs.length){

    box.innerHTML = `

      <div class="
        bg-white
        border
        rounded-2xl
        p-5
        shadow-sm
      ">

        <div class="
          font-bold text-sm
        ">
          Job Cards
        </div>

        <div class="
          text-xs text-slate-400
          mt-3
        ">
          No Job Cards found for
          <b>${escapeHtml(
            wo.name
          )}</b>.
        </div>

        <button

async function openWorkOrder(id){

  if(!id){
    return;
  }

  currentView="workOrder";

  removeWorkOrderCreateButton();

  localStorage.setItem(
    "sr_page_view",
    "workOrder"
  );

  localStorage.setItem(
    "sr_page_doctype",
    "Work Order"
  );

  localStorage.setItem(
    "sr_current_work_order",
    id
  );

  try{

    selectedWorkOrder =
      await api(
        "/api/method/sr_connect.www.home.get_work_order?work_order_id="
        + encodeURIComponent(id)
      );

    
    selectedWorkOrder.previous_batch_no =
      String(
        selectedWorkOrder.previous_batch_no ||
        ""
      ).trim().toUpperCase();

    selectedWorkOrder.batch_no =
      String(
        selectedWorkOrder.batch_no ||
        ""
      ).trim().toUpperCase();

if(
      !selectedWorkOrder ||
      !selectedWorkOrder.name
    ){
      throw new Error(
        "Work Order data was not returned by ERPNext"
      );
    }

    
    /*
     * SR V3:
     * Any submitted Stock Entry linked to this Work Order
     * means stock activity has started.
     */
    try{

      const stockStatus =
        await api(
          "/api/method/sr_connect.www.home.get_work_order_stock_status?work_order_id="
          + encodeURIComponent(id)
        );

      const entries =
        stockStatus?.entries ||
        stockStatus?.message?.entries ||
        [];

      if(
        Array.isArray(entries) &&
        entries.length > 0
      ){

        selectedWorkOrder.sr_stock_status =
          "In Process";

      }else{

        selectedWorkOrder.sr_stock_status =
          "";

      }

    }catch(e){

      console.warn(
        "SR V3 stock status check failed:",
        e
      );

      selectedWorkOrder.sr_stock_status =
        "";

    }

renderWorkOrder();

  }catch(e){

    console.error(
      "openWorkOrder",
      e
    );

    alert(e.message);
  }
}



async function srOpenMaterialConsumption(){
  try{
    if(!selectedWorkOrder || !selectedWorkOrder.name){
      alert("Work Order select kora nei.");
      return;
    }

    const woId = String(selectedWorkOrder.name).trim();

    // Get LIVE Work Order values
    const woRes = await fetch(
      "/api/resource/Work%20Order/" + encodeURIComponent(woId),
      {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        credentials: "same-origin"
      }
    );

    const woJson = await woRes.json();

    if(!woRes.ok){
      throw new Error(
        (woJson && woJson.exc_type)
          ? woJson.exc_type
          : "Failed to load Work Order"
      );
    }

    const wo = woJson.data || {};

    const woQty = Number(wo.qty || 0);
    const producedQty = Number(wo.produced_qty || 0);
    const transferredQty = Number(
      wo.material_transferred_for_manufacturing || 0
    );

    /*
     * IMPORTANT:
     * Material Consumption must use the ACTUAL completed
     * quantity of the final operation (PACKING & SHIFTING).
     *
     * Example:
     * WO Qty = 1000
     * Packing & Shifting completed = 975
     * Material Consumption = 975
     *
     * Do NOT use transferred_qty as the manufactured qty.
     */

    let qty = 0;

    const operations =
      Array.isArray(wo.operations)
        ? wo.operations
        : [];

    /*
     * First priority:
     * Work Order Operation -> PACKING & SHIFTING
     */
    for(const op of operations){

      const operationName =
        String(
          op.operation ||
          op.operation_name ||
          ""
        ).trim().toUpperCase();

      if(operationName === "PACKING & SHIFTING"){

        const completed =
          Number(
            op.completed_qty || 0
          );

        if(
          Number.isFinite(completed) &&
          completed > 0
        ){
          qty = completed;
          break;
        }
      }
    }

    /*
     * Fallback:
     * Job Card data if operations array does not contain
     * the completed quantity.
     */
    if(qty <= 0){

      const jobCards =
        Array.isArray(wo.job_cards)
          ? wo.job_cards
          : [];

      for(const jc of jobCards){

        const operationName =
          String(
            jc.operation ||
            ""
          ).trim().toUpperCase();

        if(operationName === "PACKING & SHIFTING"){

          const completed =
            Number(
              jc.completed_qty ||
              jc.total_completed_qty ||
              0
            );

          if(
            Number.isFinite(completed) &&
            completed > 0
          ){
            qty = completed;
            break;
          }
        }
      }
    }

    /*
     * Final fallback only when Packing & Shifting
     * completion is not available.
     */
    if(qty <= 0){

      qty =
        transferredQty > 0
          ? transferredQty - producedQty
          : woQty - producedQty;
    }

    qty = Number(qty);

    if(!Number.isFinite(qty) || qty <= 0){
      alert(
        "Invalid Material Consumption quantity.\n\n" +
        "WO Qty: " + woQty + "\n" +
        "Produced Qty: " + producedQty + "\n" +
        "Transferred Qty: " + transferredQty
      );
      return;
    }

    console.log(
      "SR Material Consumption:",
      {
        work_order_id: woId,
        purpose: "Material Consumption for Manufacture",
        qty: qty
      }
    );

    // Use Frappe's native RPC mechanism for the existing ERPNext method.
    const response = await new Promise((resolve, reject) => {
      frappe.call({
        method:
          "sr_connect.sr_connect.www.home.sr_make_material_consumption_stock_entry",
        args: {
          work_order_id: woId,
          purpose: "Material Consumption for Manufacture",
          qty: Number(qty)
        },
        callback: function(r) {
          if(r && r.exc) {
            reject(new Error("ERPNext Material Consumption failed."));
            return;
          }

          if(!r || !r.message) {
            reject(new Error("ERPNext returned empty Stock Entry."));
            return;
          }

          resolve(r.message);
        }
      });
    });

    const doc = response;

    console.log(
      "Native Material Consumption response:",
      doc,
      "qty=",
      Number(qty)
    );

    if(doc && doc.name){
      frappe.set_route("Form", doc.doctype || "Stock Entry", doc.name);
      return;
    }

    throw new Error("Stock Entry name was not returned by ERPNext.");
  }catch(err){
    console.error("SR Material Consumption ERROR:", err);
    alert(
      err && err.message
        ? err.message
        : "Material Consumption failed."
    );
  }
}

window.srActiveBatchUpdate = async function(){

  if(!selectedWorkOrder){
    return;
  }

  const status =
    String(
      selectedWorkOrder.status || "Not Started"
    ).trim();

  if(status !== "Not Started"){
    alert(
      "Batch No cannot be changed after Stock Transfer."
    );
    return;
  }

  const newBatch =
    String(
      selectedWorkOrder.pending_batch_no ||
      selectedWorkOrder.batch_no ||
      ""
    ).trim().toUpperCase();

  if(!newBatch){
    alert("Batch No is required.");
    return;
  }

  const updateBtn =
    document.getElementById(
      "srWorkOrderBatchUpdate"
    );

  if(updateBtn){
    updateBtn.disabled = true;
    updateBtn.innerText = "UPDATING...";
  }

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.update_work_order_batch",
        {
          method:"POST",
          body:JSON.stringify({
            work_order_id:
              selectedWorkOrder.name,

            batch_no:
              newBatch
          })
        }
      );

    selectedWorkOrder.previous_batch_no =
      String(
        result &&
        result.previous_batch_id
          ? result.previous_batch_id
          : selectedWorkOrder.batch_no || ""
      ).trim().toUpperCase();

    selectedWorkOrder.batch_no =
      String(
        result &&
        result.batch_no !== undefined
          ? result.batch_no
          : newBatch
      ).trim().toUpperCase();

    delete selectedWorkOrder.pending_batch_no;

    renderWorkOrder();

  }catch(err){

    console.error(
      "Work Order Batch UPDATE failed:",
      err
    );

    alert(
      err && err.message
        ? err.message
        : "Batch No UPDATE failed."
    );

    if(updateBtn){
      updateBtn.disabled = false;
      updateBtn.innerText = "UPDATE";
    }
  }
};




async function submitDraftWorkOrder(){

  const workOrderId =
    String(
      selectedWorkOrder?.name ||
      window.srCreatedWorkOrder?.name ||
      srDraftWorkOrderId ||
      ""
    ).trim();

  if(!workOrderId){
    alert("Work Order not found.");
    return;
  }

  try{

    /*
     * Always get the complete Work Order first.
     */
    const wo =
      await api(
        "/api/method/sr_connect.www.home.get_work_order" +
        "?work_order_id=" +
        encodeURIComponent(workOrderId)
      );

    if(!wo || !wo.name){
      throw new Error(
        "Work Order details could not be loaded."
      );
    }

    /*
     * Use the actual ERPNext Work Order data.
     */
    const item =
      String(
        wo.production_item ||
        ""
      ).trim();

    const bom =
      String(
        wo.bom_no ||
        wo.bom ||
        wo.bom_reference ||
        ""
      ).trim();

    const qty =
      Number(
        wo.qty ||
        wo.quantity ||
        0
      );

    const labour =
      Number(
        wo.labour_qty ||
        wo.custom_labour_qty ||
        0
      );

    const date =
      String(
        wo.custom_date ||
        wo.posting_date ||
        wo.transaction_date ||
        ""
      ).trim();

    const batch =
      String(
        wo.batch_no ||
        wo.pending_batch_no ||
        ""
      ).trim();

    /*
     * Do not block submission just because optional
     * display fields are absent from get_work_order.
     * Item + quantity are the minimum required here.
     */
    if(!item || !qty){
      console.error(
        "Incomplete Work Order:",
        wo
      );

      throw new Error(
        "Work Order data is incomplete."
      );
    }

    const result =
      await api(
        "/api/method/sr_connect.www.home.create_work_order_from_sr",
        {
          method:"POST",

          body:JSON.stringify({

            production_item:
              item,

            bom_no:
              bom,

            qty:
              qty,

            labour_qty:
              labour,

            posting_date:
              date,

            new_batch_no:
              batch,

            batch_no:
              batch,

            work_order_id:
              wo.name,

            submit:
              1

          })
        }
      );

    if(
      !result ||
      !result.success
    ){
      throw new Error(
        result?.error ||
        "Work Order submission failed."
      );
    }

    localStorage.removeItem(
      "sr_draft_work_order"
    );

    srDraftWorkOrderId = "";

    selectedWorkOrder =
      await api(
        "/api/method/sr_connect.www.home.get_work_order" +
        "?work_order_id=" +
        encodeURIComponent(
          result.name ||
          wo.name
        )
      );

    await renderWorkOrder();

  }catch(e){

    console.error(
      "Draft Work Order Submit Error:",
      e
    );

    alert(
      e.message ||
      "Work Order submission failed."
    );

  }

}

async function openDraftWorkOrderForEdit(id){

  if(!id){
    return;
  }

  try{

    const wo =
      await api(
        "/api/method/sr_connect.www.home.get_work_order?work_order_id=" +
        encodeURIComponent(id)
      );

    if(
      !wo ||
      !wo.name
    ){
      throw new Error(
        "Work Order data could not be loaded."
      );
    }

    /*
     * Only Draft opens in editable Create Work Order form.
     */
    if(
      Number(wo.docstatus || 0) !== 0
    ){
      selectedWorkOrder = wo;
      openWorkOrder(wo.name);
      return;
    }

    /*
     * Keep exact Draft ID so SAVE / SUBMIT update
     * the SAME Work Order instead of creating another one.
     */
    srDraftWorkOrderId =
      String(wo.name);

    localStorage.setItem(
      "sr_draft_work_order",
      String(wo.name)
    );

    localStorage.setItem(
      "sr_current_work_order",
      String(wo.name)
    );

    /*
     * Open existing Create Work Order form.
     * It normally resets the fields first.
     */
    await window.openCreateWorkOrder();

    const item =
      String(
        wo.production_item ||
        ""
      ).trim();

    const itemLabel =
      String(
        wo.item_name ||
        wo.production_item ||
        ""
      ).trim();

    const bomName =
      String(
        wo.bom_no ||
        wo.bom ||
        ""
      ).trim();

    const qty =
      wo.qty != null
        ? wo.qty
        : "";

    const labour =
      wo.labour_qty != null
        ? wo.labour_qty
        : (
            wo.custom_labour_qty != null
              ? wo.custom_labour_qty
              : ""
          );

    const mfgDate =
      String(
        wo.custom_date ||
        wo.posting_date ||
        wo.transaction_date ||
        ""
      ).slice(0,10);

    const batch =
      String(
        wo.pending_batch_no ||
        wo.batch_no ||
        ""
      ).trim();

    /*
     * Item
     */
    const hidden =
      document.getElementById(
        "woProductionItem"
      );

    const search =
      document.getElementById(
        "woProductionItemSearch"
      );

    if(hidden){
      hidden.value = item;
    }

    if(search){
      search.value =
        itemLabel;
    }

    /*
     * Load Item/BOM/Shelf Life using the existing
     * Item selection logic.
     */
    if(
      item &&
      typeof window.selectERPItem === "function"
    ){

      await window.selectERPItem(
        item,
        itemLabel || item
      );

    }else if(
      item &&
      typeof loadWorkOrderBOMs === "function"
    ){

      await loadWorkOrderBOMs();

    }

    /*
     * BOM
     */
    const bom =
      document.getElementById(
        "woBOM"
      );

    if(bom){

      bom.value =
        bomName;

      bom.dispatchEvent(
        new Event(
          "change",
          { bubbles:true }
        )
      );

    }

    /*
     * Quantity
     */
    const qtyEl =
      document.getElementById(
        "woQty"
      );

    if(qtyEl){
      qtyEl.value =
        qty;
    }

    /*
     * Labour
     */
    const labourEl =
      document.getElementById(
        "woLabourQty"
      );

    if(labourEl){
      labourEl.value =
        labour;
    }

    /*
     * MFG Date
     */
    const dateEl =
      document.getElementById(
        "woDate"
      );

    if(dateEl){
      dateEl.value =
        mfgDate;
    }

    /*
     * Batch
     */
    const batchEl =
      document.getElementById(
        "woNewBatch"
      );

    if(batchEl){
      batchEl.value =
        batch;
    }

    /*
     * EXP + Shelf Life
     */
    if(
      typeof refreshWorkOrderExpiry ===
      "function"
    ){

      await refreshWorkOrderExpiry();

    }

    /*
     * Refresh BOM/raw-material preview.
     */
    if(
      typeof refreshWorkOrderPreview ===
      "function"
    ){

      try{
        refreshWorkOrderPreview();
      }catch(e){
        console.warn(
          "Draft preview refresh failed:",
          e
        );
      }

    }

    const msg =
      document.getElementById(
        "woCreateMessage"
      );

    if(msg){
      msg.innerText =
        "Draft Work Order: " +
        wo.name +
        " — edit and SAVE or SUBMIT";
    }

  }catch(e){

    console.error(
      "OPEN DRAFT WORK ORDER ERROR:",
      e
    );

    alert(
      e.message ||
      "Draft Work Order could not be opened."
    );

  }

}

async function restorePage(){

  const savedView =
    localStorage.getItem(
      "sr_page_view"

  const savedWorkOrder =
    localStorage.getItem(
      "sr_current_work_order"
    );

  const savedType =
    localStorage.getItem(
      "sr_page_doctype"
    ) || "";

  try{

    if(
      savedView === "workOrder" &&
      savedWorkOrder
    ){

      selectedWorkOrder =
        await api(
          "/api/method/sr_connect.www.home.get_work_order?work_order_id="
          + encodeURIComponent(
            savedWorkOrder
          )
        );

      renderWorkOrder();
      return;
    }

    if(savedView === "list"){

      await loadList(
        savedType || "Job Card",
        true
      );

      return;
    }

  }catch(e){

    console.error(
      "restorePage Work Order",
      e
    );

  }

  localStorage.removeItem(
    "sr_current_work_order"
  );

  showHome();
}

/* =========================================================
   PAGE STATE — SURVIVE REFRESH
   ========================================================= */

function savePageState(){

  try{

    /*
     * =====================================================
     * REFRESH PROTECTION
     *
     * If a Job Card was opened, NEVER allow any refresh /
     * beforeunload code to change the saved page to LIST.
     * =====================================================
     */

    const storedJob =
      localStorage.getItem("sr_current_job") || "";

    const storedBatch =
      localStorage.getItem("sr_current_batch") || "";


    /*
     * JOB CARD HAS HIGHEST PRIORITY
     */
    if(storedJob){

      localStorage.setItem(
        "sr_page_view",
        "job"
      );

      localStorage.setItem(
        "sr_current_job",
        storedJob
      );

      if(selectedJob && selectedJob.name){

        localStorage.setItem(
          "sr_current_job",
          selectedJob.name
        );

        if(selectedJob.work_order){

          localStorage.setItem(
            "sr_current_work_order",
            selectedJob.work_order
          );

        }

      }

      console.debug(
        "SR STATE SAVE: JOB",
        localStorage.getItem("sr_current_job")
      );

      return;
    }


    /*
     * BATCH DETAIL HAS SECOND PRIORITY
     */
    if(
      currentView === "batchJobs" &&
      storedBatch
    ){

      localStorage.setItem(
        "sr_page_view",
        "batchJobs"
      );

      localStorage.setItem(
        "sr_current_batch",
        storedBatch
      );

      console.debug(
        "SR STATE SAVE: BATCH",
        storedBatch
      );

      return;
    }


    /*
     * NORMAL PAGE
     */
    localStorage.setItem(
      "sr_page_view",
      currentView || "home"
    );

    localStorage.setItem(
      "sr_page_doctype",
      currentDocType || ""
    );

    const search =
      document.getElementById("search");

    if(search){

      localStorage.setItem(
        "sr_page_search",
        search.value || ""
      );

    }


    const batchSearch =
      document.getElementById("batchSearch");

    if(batchSearch){

      localStorage.setItem(
        "sr_page_batch_search",
        batchSearch.value || ""
      );

    }


    localStorage.setItem(
      "sr_page_job_filter",
      jobFilter || "All"
    );


    /*
     * Do NOT delete current Job Card here.
     */

  }catch(e){

    console.debug(
      "savePageState error",
      e
    );

  }

}

function clearPageState(){

  localStorage.removeItem("sr_page_view");
  localStorage.removeItem("sr_page_doctype");
  localStorage.removeItem("sr_page_search");
  localStorage.removeItem("sr_page_batch_search");
  localStorage.removeItem("sr_page_job_filter");
  localStorage.removeItem("sr_current_job");
  localStorage.removeItem("sr_current_work_order");

}


window.addEventListener("beforeunload",savePageState);

function goBack(){

  if(
    currentView === "stockEntryDetail" ||
    currentView === "stockEntryBatches" ||
    currentView === "stockEntryHome"
  ){

    if(
      history.state &&
      history.state.srStockEntry
    ){

      history.back();

    }else{

      showManufacturing();

    }

    return;
  }


  /*
   * Browser history is the source of truth.
   *
   * Back:
   * Assign
   *   -> Stock Transfer
   *   -> Work Order
   *   -> Work Order List
   *   -> Manufacturing
   *   -> Home
   *
   * Forward returns to the exact previous screen.
   */

  const state =
    history.state;

  if(
    state &&
    state.sr_connect &&
    Number(
      state.depth || 0
    ) > 0
  ){

    history.back();

    return;
  }


  /*
   * Safe fallback when there is no
   * SR Connect history entry.
   */

  if(currentView === "assignEmployee"){

    currentView =
      "workOrder";

    const wo =
      selectedWorkOrder ||
      window.srCreatedWorkOrder;

    if(
      wo &&
      wo.name
    ){

      selectedWorkOrder =
        wo;

      window.srCreatedWorkOrder =
        wo;

      renderWorkOrder();

    }else{

      currentDocType =
        "Work Order";

      currentView =
        "list";

      loadList(
        "Work Order",
        false
      );

    }

    return;
  }


  if(currentView === "stockTransfer"){

    currentView =
      "workOrder";

    const wo =
      selectedWorkOrder ||
      window.srCreatedWorkOrder;

    if(
      wo &&
      wo.name
    ){

      selectedWorkOrder =
        wo;

      window.srCreatedWorkOrder =
        wo;

      renderWorkOrder();

    }else{

      currentDocType =
        "Work Order";

      currentView =
        "list";

      loadList(
        "Work Order",
        false
      );

    }

    return;
  }


  if(currentView === "createWorkOrder"){

    currentDocType =
      "Work Order";

    currentView =
      "list";

    loadList(
      "Work Order",
      false
    );

    return;
  }


  if(currentView === "workOrder"){

    currentDocType =
      "Work Order";

    currentView =
      "list";

    loadList(
      "Work Order",
      false
    );

    return;
  }


  if(currentView === "list"){

    currentView =
      "manufacturing";

    showManufacturing();

    return;
  }


  if(currentView === "manufacturing"){

    currentView =
      "home";

    showHome();

    return;
  }


  showHome();

}

/* =========================================================
   API
   ========================================================= */

async function api(url,options={}){
  options.headers=options.headers||{};
  options.headers["X-Frappe-CSRF-Token"]="{{ csrf_token }}";

  if(options.method==="POST"){
    options.headers["Content-Type"]="application/json";
  }

  const response=await fetch(url,options);
  const text=await response.text();

  let data;
  try{
    data=JSON.parse(text);
  }catch(e){
    throw new Error("Server returned invalid response");
  }

  if(!response.ok || data.exc){
    let msg=data._server_messages || data.exception || data.exc || "Server error";

    try{
      if(typeof msg==="string" && msg.startsWith("[")){
        const parsed=JSON.parse(msg);
        if(parsed[0]){
          msg=parsed[0].message || msg;
        }
      }
    }catch(e){}

    // Remove HTML tags from Frappe messages.
    msg=String(msg).replace(/<[^>]*>/g,"");

    throw new Error(msg);
  }

  return data.message;
}

    return;

  /*

   */
  const old =
    document.getElementById(

      button

  /*

  const latest =
    document.getElementById(
      "woLatestBatch"
    );

  if(latest){

    latest.classList.add(
      "hidden"
    );

    latest.innerHTML="";

  }

  const newBatch =
    document.getElementById(
      "woNewBatch"
    );

  if(newBatch){
    newBatch.value="";
  }

  /*
   * Reset Required Materials.
   */
  const required =
    document.getElementById(
      "woRequiredItems"

  if(required){
    required.innerHTML="";
  }

  const message =
    document.getElementById(
      "woCreateMessage"
    );

  if(message){
    message.innerText="";
  }

  /*

  if(
    typeof window.loadManufacturingItems ===
    "function"
  ){

    try{
      await window.loadManufacturingItems();
    }catch(e){
      console.error(
        "loadManufacturingItems:",

async function srOpenStockBalanceCategory(category){

  srStockBalanceCategory =
    String(category || "").trim();

  srStockBalanceItem = "";
  srStockBalanceMonths = [];

  document.getElementById("pageTitle").innerText =
    srStockBalanceCategory;

  document.getElementById("pageSub").innerText =
    "Item Name";

  const box =
    document.getElementById("listContainer");

  box.innerHTML =
    "<div class='text-center py-10 text-xs text-slate-400'>"
    + "Loading..."
    + "</div>";

  const back =
    document.getElementById("backBtn");

  if(back){
    back.onclick = srStockBalanceBack;
  }

  try{

    const data = await api(
      "/api/method/sr_connect.www.home.get_stock_balance_items"
      + "?category="
      + encodeURIComponent(
        srStockBalanceCategory
      )
    );

    const items =
      Array.isArray(data?.items)
        ? data.items
        : [];

    if(!items.length){

      box.innerHTML =
        "<div class='text-center py-10 text-xs text-slate-400'>"
        + "No items found."
        + "</div>";

      return;
    }

    window.srStockBalanceItemList = items;

    box.innerHTML = `
      <div class="mb-3">
        <input
          id="srStockBalanceItemSearch"
          type="text"
          placeholder="Search Item Name..."
          autocomplete="off"
          class="w-full border rounded-xl px-3 py-2.5
                 text-sm outline-none
                 focus:ring-2 focus:ring-slate-200"
        >
      </div>

      <div id="srStockBalanceItemResults"
           class="space-y-2">
      </div>
    `;

    const renderItems = function(){

      const search =
        String(
          document.getElementById(
            "srStockBalanceItemSearch"
          )?.value || ""
        )
        .trim()
        .toLowerCase();

      const filtered =
        window.srStockBalanceItemList.filter(item => {

          const name =
            String(
              item.item_name ||
              item.name ||
              ""
            ).toLowerCase();

          const code =
            String(
              item.name || ""
            ).toLowerCase();

          return (
            !search ||
            name.includes(search) ||
            code.includes(search)
          );
        });

      const resultBox =
        document.getElementById(
          "srStockBalanceItemResults"
        );

      if(!resultBox){
        return;
      }

      if(!filtered.length){

        resultBox.innerHTML =
          "<div class='text-center py-8 text-xs text-slate-400'>"
          + "No matching item found."
          + "</div>";

        return;
      }

      resultBox.innerHTML =
        filtered.map(item => `
          <div
            onclick="srOpenStockBalanceItem('${escapeAttr(item.name)}')"
            class="bg-white border rounded-xl px-4 py-3
                   shadow-sm cursor-pointer
                   active:scale-[.99] transition-all"
          >
            <div class="font-bold text-sm text-slate-800">
              ${escapeHtml(
                item.item_name ||
                item.name ||
                "-"
              )}
            </div>
          </div>
        `).join("");
    };

    const searchInput =
      document.getElementById(
        "srStockBalanceItemSearch"
      );

    if(searchInput){
      searchInput.addEventListener(
        "input",
        renderItems
      );
    }

    renderItems();

  }catch(e){

    box.innerHTML =
      "<div class='text-center py-10 text-xs text-rose-500'>"
      + escapeHtml(
        e.message ||
        "Failed to load items."
      )
      + "</div>";

  }
}

async function srToggleStockBalanceBatches(month, btn){

  const wrapper =
    btn.closest(".border-b");

  if(!wrapper){
    return;
  }

  const batchBox =
    wrapper.querySelector(".sr-stock-batch-box");

  if(!batchBox){
    return;
  }

  const isOpen =
    !batchBox.classList.contains("hidden");

  if(isOpen){

    batchBox.classList.add("hidden");
    btn.setAttribute("aria-expanded","false");

    const span = btn.querySelector("span");
    if(span) span.innerText = "▼";

    return;
  }

  batchBox.classList.remove("hidden");
  batchBox.innerHTML =
    "<div class='py-3 text-center text-[10px] text-slate-400'>"
    + "Loading batches..."
    + "</div>";

  btn.setAttribute("aria-expanded","true");

  const span = btn.querySelector("span");
  if(span) span.innerText = "▲";

  try{

    const data = await api(
      "/api/method/sr_connect.www.home.get_stock_balance_batches"
      + "?item_code="
      + encodeURIComponent(srStockBalanceItem)
      + "&month="
      + encodeURIComponent(month)
      + "&category="
      + encodeURIComponent(srStockBalanceCategory)
    );

    const batches =
      Array.isArray(data?.batches)
        ? data.batches
        : Array.isArray(data)
          ? data
          : [];

    if(!batches.length){

      batchBox.innerHTML =
        "<div class='py-3 text-center text-[10px] text-slate-400'>"
        + "No batch stock."
        + "</div>";

      return;
    }

    batchBox.innerHTML = `
      <div class="bg-white border rounded-lg overflow-hidden">

        ${batches.map(batch => {

          const status =
            String(batch.status || "").toLowerCase();

          let dotClass =
            "bg-emerald-500";

          if(
            status === "expired" ||
            batch.is_expired
          ){
            dotClass = "bg-red-500";
          }else if(
            status === "near_expiry" ||
            status === "near expiry"
          ){
            dotClass = "bg-orange-400";
          }

          return `
            <div
              class="grid grid-cols-[1fr_auto_auto]
                     gap-3 items-center
                     px-3 py-2.5
                     border-b last:border-b-0"
            >

              <div class="font-bold text-xs text-slate-700">
                ${escapeHtml(batch.batch_no || "-")}
              </div>

              <div class="text-right
                          font-bold text-xs
                          text-slate-800">
                ${escapeHtml(
                  formatQty(
                    batch.balance ??
                    batch.qty ??
                    0
                  )
                )}
                <span class="font-normal
                             text-[9px]
                             text-slate-400">
                  ${escapeHtml(
                    batch.stock_uom ||
                    data.stock_uom ||
                    ""
                  )}
                </span>
              </div>

              <span
                class="w-2.5 h-2.5
                       rounded-full
                       ${dotClass}"
              ></span>

            </div>
          `;
        }).join("")}

      </div>
    `;

  }catch(e){

    batchBox.innerHTML =
      "<div class='py-3 text-center text-[10px] text-rose-500'>"
      + escapeHtml(
          e.message ||
          "Failed to load batches."
        )
      + "</div>";

  }
}

async function loadList(type, restoring=false){

  /*
   * IMPORTANT:
   * When restorePage() is rebuilding a Job / Batch / Work Order
   * page, loadList() must NOT overwrite the persisted page state.
   *
   * Normal navigation still behaves exactly as before.
   */
  const restoringSpecialPage =
    restoring &&
    (
      localStorage.getItem("sr_current_job") ||
      localStorage.getItem("sr_current_batch") ||
      localStorage.getItem("sr_current_work_order")
    );

  currentDocType=type;

  if(type === "Stock Balance"){
    await srStockBalanceCategories();
    return;
  }

  hideAll();
  document.getElementById("listView").classList.remove("hidden");

  if(!restoringSpecialPage){

    currentView="list";
    savePageState();

  }
  document.getElementById("pageTitle").innerText=type;
  document.getElementById("pageSub").innerText="Assigned";

  /*
   * Work Order Create button is managed centrally by
   * ensureWorkOrderCreateButton().
   */
  document.getElementById("backBtn").classList.remove("hidden");
  document.getElementById("search").value="";
  if(document.getElementById("batchSearch")) document.getElementById("batchSearch").value="";

  if(!restoring){
    /*
     * Keep the user's selected filter.
     * Never force the Job Card page back to In Process.
     */
    if(type === "Job Card"){
      jobFilter =
        localStorage.getItem("sr_page_job_filter")
        || jobFilter
        || "All";
    } else {
      jobFilter = jobFilter || "All";
    }
  }

  const filters=document.getElementById("jobFilters");
  if(filters){
    filters.classList.toggle("hidden",type!=="Job Card");
  }

  updateJobFilterButtons();

  document.getElementById("listContainer").innerHTML=
    "<div class='text-center py-10 text-xs text-slate-400'>Loading...</div>";

  try{
    rawItems=await api(
      "/api/method/sr_connect.www.home.get_user_assigned_orders?doctype="
      +encodeURIComponent(type)
    );

    updateBatchOptions();
    renderList();
  }catch(e){
    document.getElementById("listContainer").innerHTML=
      "<div class='text-center py-10 text-xs text-rose-500'>"
      +escapeHtml(e.message)
      +"</div>";
  }
}


function setJobFilter(filter){

  jobFilter = filter;

  /*
   * IMPORTANT:
   * Save the selected Job Card filter immediately.
   * This prevents Back / Refresh from restoring
   * an old filter and showing "No records found".
   */
  if(currentDocType === "Job Card"){

    localStorage.setItem(
      "sr_page_job_filter",
      jobFilter
    );

  }

  updateJobFilterButtons();
  renderList();

}


function updateJobFilterButtons(){
  const buttons={
    "All":document.getElementById("filterAll"),
    "Not Started":document.getElementById("filterNotStarted"),
    "Completed":document.getElementById("filterCompleted")
  };

  Object.entries(buttons).forEach(([key,btn])=>{
    if(!btn)return;
    btn.className=jobFilter===key
      ?"py-2 rounded-lg bg-slate-900 text-white text-[10px] font-bold"
      :"py-2 rounded-lg bg-slate-100 text-slate-600 text-[10px] font-bold";
  });
}


function normalizedJobStatus(o){
  if(Number(o.docstatus)===1)return "Completed";
  if(o.category==="Completed" || o.status==="Completed")return "Completed";
  if(o.running)return "In Process";
  if(Number(o.elapsed_seconds||0)>0)return "In Process";
  return "Not Started";
}

function openBatchJobs(batch){

  const box =
    document.getElementById("listContainer");

  if(!box){
    return;
  }


  const batchValue =
    String(batch || "").trim();


  let jobs =
    rawItems.filter(o => {

      const itemBatch =
        String(o.batch_no || "").trim();

      return itemBatch === batchValue &&
        (
          jobFilter === "All" ||
          normalizedJobStatus(o) === jobFilter
        );

    });


  /*
   * Operation sequence
   */

  jobs.sort((a,b) => {

    const ai =
      Number(
        a.operation_idx ||
        a.idx ||
        999999
      );

    const bi =
      Number(
        b.operation_idx ||
        b.idx ||
        999999
      );

    return ai - bi;

async function getLatestWorkOrderBatch(){

  const item =
    String(
      document.getElementById(
        "woProductionItem"
      )?.value || ""
    ).trim();

  const box =
    document.getElementById(
      "woLatestBatch"
    );

  if(!item){

    alert(
      "Select Item to Manufacture first"
    );

    return;
  }

  if(box){

    box.classList.remove(
      "hidden"
    );

    box.innerHTML =
      '<div class="text-xs text-slate-400">' +
      'Loading latest Work Order batch...' +
      '</div>';

  }

  try{

    /*
     * IMPORTANT:
     *
     * Do NOT call:
     * get_latest_work_order_batch
     *
     * That old API could read the Batch master.
     *
     * This API reads:
     * Work Order.custom_new_batch_id
     */
    const result =
      await api(
        "/api/method/sr_connect.www.home.get_latest_work_order_new_batch"
        + "?production_item="
        + encodeURIComponent(item)
      );

    console.log(
      "LATEST WORK ORDER BATCH RESPONSE:",
      result
    );

    if(
      !result ||
      !result.batch_no
    ){

      if(box){

        box.innerHTML =
          '<div class="text-xs text-slate-400">' +
          'No previous Work Order batch found for this item.' +
          '</div>';

      }

      return;
    }

    /*
     * Put latest Work Order batch into
     * New Batch No field only as a helper.
     *
     * User can still replace it with the
     * new batch number they want to create.
     */
    const batchField =
      document.getElementById(
        "woNewBatch"
      );

    if(batchField){

      /*
       * GET LATEST BATCH:
       * Only put the value into the SR Connect New Batch field.
       * Do NOT trigger change/input/blur events.
       * Do NOT touch Previous Batch Id.
       */
      const latestBatch =
        String(result.batch_no || "").trim();

      batchField.value = latestBatch;

      /*
       * Keep the selected Work Order's batch value in memory only.
       * Previous Batch Id is NEVER modified.
       */
      if(window.selectedWorkOrder){
        window.selectedWorkOrder.batch_no = latestBatch;
      }

      if(window.srCreatedWorkOrder){
        window.srCreatedWorkOrder.batch_no = latestBatch;
      }

    }

    if(box){

      box.innerHTML = `

        <div class="text-[10px] text-slate-400">
          LATEST WORK ORDER BATCH

            <div class="text-[10px] text-slate-500 mt-1">
              From Work Order:
              <b>${escapeHtml(
                result.work_order
              )}</b>
            </div>
          `

    }

  }catch(e){

    console.error(
      "Latest Work Order Batch Error:",
      e
    );

    if(box){

      box.innerHTML =
        '<div class="text-xs text-rose-500">' +
        escapeHtml(
          e.message ||
          "Unable to get latest Work Order batch"
        ) +
        '</div>';

    }

  }

}



async function saveCreateWorkOrder(submit=false){

  const item =
    String(
      document.getElementById(
        "woProductionItem"
      )?.value || ""
    ).trim();

  const bom =
    String(
      document.getElementById(
        "woBOM"
      )?.value || ""
    ).trim();

  const qty =
    Number(
      document.getElementById(
        "woQty"
      )?.value || 0
    );

  const labour =
    Number(
      document.getElementById(
        "woLabourQty"
      )?.value || 0
    );

  const date =
    String(
      document.getElementById(
        "woDate"
      )?.value || ""
    ).trim();

  const batch =
    String(
      document.getElementById(
        "woNewBatch"
      )?.value || ""
    ).trim();

  const msg =
    document.getElementById(
      "woCreateMessage"
    );

  /*
   * SAVE:
   *   no existing ID -> create Draft
   *
   * SUBMIT:
   *   existing ID -> submit SAME Draft
   */
  const existingWorkOrder =
    srDraftWorkOrderId ||
    localStorage.getItem(
      "sr_draft_work_order"
    ) ||
    "";

  if(!item){

    if(msg)
      msg.innerText =
        "Item to Manufacture is required";

    return;
  }

  if(!bom){

    if(msg)
      msg.innerText =
        "Please select BOM";

    return;
  }

  if(!qty || qty <= 0){

    if(msg)
      msg.innerText =
        "Qty must be greater than zero";

    return;
  }

  if(!labour || labour <= 0){

    if(msg)
      msg.innerText =
        "Labour Qty is required";

    return;
  }

  if(!batch){

    if(msg)
      msg.innerText =
        "New Batch No is required";

    return;
  }

  if(msg){

    msg.innerText =
      submit
        ? "Submitting Work Order..."
        : "Saving Work Order...";

  }

  try{

    const result =
      await api(
        "/api/method/sr_connect.www.home.create_work_order_from_sr",
        {
          method:"POST",

          body:JSON.stringify({

            production_item:
              item,

            bom_no:
              bom,

            qty:
              qty,

            labour_qty:
              labour,

            posting_date:
              date,

            /*
             * Backend accepts both.
             */
            new_batch_no:
              batch,

            batch_no:
              batch,

            /*
             * Empty on first SAVE.
             * Existing Draft on SUBMIT.
             */
            work_order_id:
              existingWorkOrder,

            submit:
              submit ? 1 : 0

          })
        }
      );

    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.error ||
        "Work Order creation failed"
      );

    }

    /*
     * Remember exact ERPNext Work Order.
     */
    srDraftWorkOrderId =
      String(
        result.name || ""
      );

    /*
     * SAVE = keep Draft ID.
     */
    if(!submit){

      if(srDraftWorkOrderId){

        localStorage.setItem(
          "sr_draft_work_order",
          srDraftWorkOrderId
        );

      }

      if(msg){

        msg.innerText =
          "Work Order saved as Draft: " +
          srDraftWorkOrderId;

      }

      return;

    }

    /*
     * SUBMIT = clear draft state only
     * after successful submission.
     */
    localStorage.removeItem(
      "sr_draft_work_order"
    );

    srDraftWorkOrderId = "";

    if(msg){

      msg.innerText =
        "Work Order submitted successfully: " +
        result.name;

    }

    /*
     * Keep submitted WO for NEXT.
     */
    window.srCreatedWorkOrder = {

      name:
        result.name,

      production_item:
        result.production_item ||
        item,

      item_name:
        result.item_name ||
        "",

      bom_no:
        result.bom_no ||
        bom,

      qty:
        Number(
          result.qty ||
          qty
        ),

      labour_qty:
        Number(
          result.labour_qty ||
          labour
        ),

      batch_no:
        result.batch_no ||
        batch,

      required_items:
        result.required_items ||
        result.work_order?.bom_items ||
        [],

      operations:
        result.operations ||
        result.work_order?.operations ||
        []

    };

    /*
     * NEXT workflow.
     */
    if(
      typeof showWorkOrderNextStep ===
      "function"
    ){

      showWorkOrderNextStep();

    }else{

      await openWorkOrder(
        result.name
      );

    }

  }catch(e){

    console.error(
      "Create Work Order Error:",
      e
    );

    if(msg){

      msg.innerText =
        e.message ||
        "Work Order creation failed";

    }

  }

}

   */
  currentView = "job";

  window.removeWorkOrderCreateButton();

  localStorage.setItem(

  );

  try{

    selectedJob = await api(
      "/api/method/sr_connect.www.home.get_job_card?job_card_id="
      + encodeURIComponent(id)
    );

    /*
     * Persist the actual returned Job Card and Work Order.
     */
    currentView = "job";

    localStorage.setItem(
      "sr_page_view",
      "job"
    );

    localStorage.setItem(
      "sr_current_job",
      selectedJob.name || id
    );

    /*
     * Job Card owns the current page state.
     * Keep Work Order only as Job Card context.

    localStorage.removeItem("sr_current_work_order");

    alert(e.message);

async function openWorkOrder(id){

  if(!id){
    return;
  }

  /*
   * Persist exact Work Order before API call.
   */
  currentView="workOrder";

  localStorage.setItem(
    "sr_page_view",
    "workOrder"
  );

  localStorage.setItem(
    "sr_current_work_order",
    id
  );

  try{

    selectedWorkOrder =
      await api(
        "/api/method/sr_connect.www.home.get_work_order?work_order_id="
        + encodeURIComponent(id)
      );

    if(
      !selectedWorkOrder ||
      !selectedWorkOrder.name
    ){
      throw new Error(
        "Work Order data was not returned by ERPNext"
      );
    }

    srEnsureParent(
      "list",
      {
        docType:
          "Work Order"
      }
    );

    
    /*
     * SR V3 SECOND WORK ORDER STATUS
     * Submitted Stock Entry = In Progress
     */
    try{

      const stockStatus =
        await api(
          "/api/method/sr_connect.www.home.get_work_order_stock_status?work_order_id="
          + encodeURIComponent(id)
        );

      const entries =
        stockStatus?.entries ||
        stockStatus?.message?.entries ||
        [];

      if(
        Array.isArray(entries) &&
        entries.length > 0
      ){

        selectedWorkOrder.sr_stock_status =
          "In Process";

      }else{

        selectedWorkOrder.sr_stock_status =
          "";

      }

    }catch(e){

      console.warn(
        "SR V3 second stock status check failed:",
        e
      );

      selectedWorkOrder.sr_stock_status =
        "";

    }

renderWorkOrder();

    srPushHistory(
      "workOrder",
      {
        workOrder:
          selectedWorkOrder.name
      }
    );

  }catch(e){

      "OPEN WORK ORDER ERROR:",

async function refreshJob(){

  if(!selectedJob || !selectedJob.name){
    return null;
  }

  const jobId = selectedJob.name;

  try{

    const freshJob = await api(
      "/api/method/sr_connect.www.home.get_job_card?job_card_id="
      + encodeURIComponent(jobId)
    );

    if(!freshJob){
      return null;
    }

    selectedJob = freshJob;

    /*
     * VERY IMPORTANT:
     * Stay on the current Job Card.
     * Do not go to Not Started / Home after refresh.
     */
    currentView = "job";

    localStorage.setItem(
      "sr_page_view",
      "job"
    );

    localStorage.setItem(
      "sr_current_job",
      selectedJob.name
    );

    if(selectedJob.work_order){
      localStorage.setItem(
        "sr_current_work_order",
        selectedJob.work_order
      );
    }

    renderJob();

    return selectedJob;

  }catch(e){

    console.error("refreshJob failed:", e);

    /*
     * Never redirect because refresh failed.
     * Keep the existing Job Card on screen.
     */
    return null;
  }
}


async function startJob(){
  if(!selectedJob)return;

  try{
    await api(
      "/api/method/sr_connect.www.home.start_job",
      {
        method:"POST",
        body:JSON.stringify({
          job_card_id:selectedJob.name
        })
      }
    );

    await refreshJob();
  }catch(e){
    alert(e.message);
  }
}


async function pauseJob(){

async function completeJob(){
  if(!selectedJob)return;

  let qty=null;

  /*
   * Every Job Card must record its actual completed quantity.
   * Intermediate operations use their Job Card / Work Order qty.
   * Final PACKING & SHIFTING keeps the user's actual final qty.
   */
  qty=prompt(
    Number(selectedJob.is_final)===1
      ? "Completed Quantity (PACKING & SHIFTING)"
      : "Completed Quantity (" +
        (selectedJob.operation || "Current Operation") +
        ")",
    String(
      selectedJob.completed_qty ||
      selectedJob.qty ||
      ""
    )
  );

  if(qty===null)return;

  if(
    qty.trim()==="" ||
    isNaN(Number(qty)) ||
    Number(qty)<=0
  ){
    alert("Valid completed quantity দিন.");
    return;
  }

  try{
    await api(
      "/api/method/sr_connect.www.home.complete_job",
      {
        method:"POST",
        body:JSON.stringify({
          job_card_id:selectedJob.name,
          completed_qty:qty
        })
      }
    );

    stopLocalTimer();
    await refreshJob();

  }catch(e){
    alert(e.message);
  }
}


function getCurrentJobElapsedSeconds(){

  if(!selectedJob){
    return 0;
  }

  let seconds=Number(
    selectedJob.elapsed_seconds || 0
  );

  if(
    selectedJob.running &&
    selectedJob.running_from
  ){

    const start=parseFrappeDate(
      selectedJob.running_from
    );

    if(start){

      const live=Math.max(
        0,
        Math.floor(
          (Date.now()-start.getTime())/1000
        )
      );

      const closed=Number(
        selectedJob.closed_elapsed_seconds || 0
      );

      seconds=closed+live;

    }

  }

  return Math.max(0,Math.floor(seconds));

}


function getOperationRequiredMinutes(){

  if(!selectedJob){
    return 0;
  }

  /*
   * Primary source:
   * Backend calculated Work Order Operation time.
   */
  const direct = Number(
    selectedJob.operation_time_in_mins || 0
  );

  if(Number.isFinite(direct) && direct > 0){
    return direct;
  }

  /*
   * Fallback:
   * Find the current operation inside Work Order Operations.
   */
  const currentOperation =
    String(selectedJob.operation || "")
      .trim()
      .toUpperCase();

  const operations =
    Array.isArray(selectedJob.work_order_operations)
      ? selectedJob.work_order_operations
      : [];

  const found = operations.find(op =>
    String(op.operation || "")
      .trim()
      .toUpperCase() === currentOperation
  );

  if(found){

    const minutes =
      Number(
        found.time_in_mins ||
        found.time_in_minutes ||
        found.operation_time_in_mins ||
        0
      );

    if(Number.isFinite(minutes) && minutes > 0){
      return minutes;
    }
  }

  return 0;
}

function formatMinutesSeconds(seconds){

  seconds=Math.max(
    0,
    Math.floor(Number(seconds)||0)
  );

  const m=Math.floor(seconds/60);
  const s=seconds%60;

  if(m<=0){
    return s+" sec";
  }

  return m+" min "+String(s).padStart(2,"0")+" sec";

}


let pendingSubmitAfterWarning=false;


function openTimeWarning(){

  const overlay=
    document.getElementById("srTimeWarningOverlay");

  const title=
    document.getElementById("srWarningTitle");

  const body=
    document.getElementById("srWarningText");

  if(!overlay || !body){
    return;
  }

  const operation=
    selectedJob?.operation || "Current operation";

  const required=
    getOperationRequiredMinutes();

  const elapsed=
    getCurrentJobElapsedSeconds();

  title.innerText=
    operation+" — Operation Time Warning";

  body.innerHTML=
    "As per BOM / Work Order operation time, <b>"
    +escapeHtml(operation)
    +"</b> requires approximately <b>"
    +escapeHtml(formatMinutesSeconds(required*60))
    +"</b>.<br><br>"
    +"Current working time is <b>"
    +escapeHtml(formatMinutesSeconds(elapsed))
    +"</b>.<br><br>"
    +"You can still submit this Job Card.";

  overlay.classList.add("show");

}


function closeTimeWarning(){

  pendingSubmitAfterWarning=false;

  const overlay=
    document.getElementById("srTimeWarningOverlay");

  if(overlay){
    overlay.classList.remove("show");
  }

}


function continueSubmitAfterWarning(){

  const overlay=
    document.getElementById("srTimeWarningOverlay");

  if(overlay){
    overlay.classList.remove("show");
  }

  pendingSubmitAfterWarning=false;

  executeSubmitJob();

}

  const spinner=
    document.getElementById("srSubmitSpinner");

  const check=
    document.getElementById("srSubmitCheck");

  const title=
    document.getElementById("srSubmitTitle");

  const msg=
    document.getElementById("srSubmitText");

  if(!overlay){
    return;
  }

  if(spinner)spinner.classList.remove("hidden");
  if(check)check.classList.add("hidden");

  if(title){
    title.innerText="Submitting Job Card";
  }

  if(msg){
    msg.innerText="Please wait...";
  }

  overlay.classList.add("show");

}


function showSubmitSuccess(){

  const spinner=
    document.getElementById("srSubmitSpinner");

  const check=
    document.getElementById("srSubmitCheck");

  const title=
    document.getElementById("srSubmitTitle");

  const msg=
    document.getElementById("srSubmitText");

  if(spinner)spinner.classList.add("hidden");
  if(check)check.classList.remove("hidden");

  if(title){
    title.innerText="Job Card Submitted";
  }

  if(msg){
    msg.innerText="Submitted successfully";
  }

}


function hideSubmitAnimation(){

  const overlay=
    document.getElementById("srSubmitOverlay");

  if(overlay){
    overlay.classList.remove("show");
  }

}


async function submitJob(){

  if(!selectedJob){
    return;
  }

  /*
   * IMPORTANT:
   * Warning happens BEFORE actual submit.
   * It never blocks submission permanently.
   */

  const requiredMinutes=
    getOperationRequiredMinutes();

  const elapsedSeconds=
    getCurrentJobElapsedSeconds();

  if(
    requiredMinutes>0 &&
    elapsedSeconds < requiredMinutes*60
  ){

    pendingSubmitAfterWarning=true;

    openTimeWarning();

    return;

  }

  await executeSubmitJob();

}


async function executeSubmitJob(){

  if(!selectedJob){
    return;
  }

  showSubmitAnimation();

  try{

    await api(
      "/api/method/sr_connect.www.home.submit_job_card",
      {
        method:"POST",
        body:JSON.stringify({

          job_card_id:selectedJob.name,

          completed_qty:
            Number(selectedJob.is_final)===1
              ?selectedJob.completed_qty
              :null

        })
      }
    );

    stopLocalTimer();

    showSubmitSuccess();

    /*
     * Refresh the Job Card silently.
     * No alert().
     */

    await refreshJob();

    /*
     * Keep success animation visible briefly.
     * Then return to the list.
     */

    setTimeout(()=>{

      hideSubmitAnimation();

      localStorage.removeItem(
        "sr_current_job"
      );

      localStorage.setItem(
        "sr_page_view",
        "list"
      );

      showList();

    },900);

  }catch(e){

    hideSubmitAnimation();

    alert(e.message);

  }

}

   TIMER
   ========================================================= */

function parseFrappeDate(value){
  if(!value)return null;

  // Frappe datetime normally comes as YYYY-MM-DD HH:mm:ss.
  // Convert it to a browser-friendly local datetime.
  const normalized=String(value).replace(" ","T");
  const d=new Date(normalized);

  if(isNaN(d.getTime()))return null;
  return d;
}


function formatSeconds(total){
  total=Math.max(0,Math.floor(Number(total)||0));

  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;

  return (
    String(h).padStart(2,"0")+":"+
    String(m).padStart(2,"0")+":"+
    String(s).padStart(2,"0")
  );
}


function renderTimer(){
  const timer=document.getElementById("timer");
  if(!timer || !selectedJob)return;

  let seconds=Number(selectedJob.elapsed_seconds||0);

  // elapsed_seconds from server includes the currently open log.
  // It is accurate at fetch time. For live ticking, subtract the
  // current open segment and add it again from the browser clock.
  if(selectedJob.running && selectedJob.running_from){

    const start=parseFrappeDate(selectedJob.running_from);

    if(start){
      const live=Math.max(
        0,
        Math.floor((Date.now()-start.getTime())/1000)
      );

      const closed=Number(
        selectedJob.closed_elapsed_seconds||0
      );

      seconds=closed+live;
    }
  }

  timer.innerText=formatSeconds(seconds);
}


function startLocalTimer(){
  stopLocalTimer();

  renderTimer();

  timerInterval=setInterval(()=>{
    if(!selectedJob || !selectedJob.running){
      return;
    }

    renderTimer();
  },1000);
}


function stopLocalTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval=null;
  }
}

function formatQty(value){
  const n=Number(value||0);

  if(!isFinite(n))return "0";

  if(Number.isInteger(n)){
    return String(n);
  }

  return n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
}


function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeAttr(value){
  return escapeHtml(value);
}
