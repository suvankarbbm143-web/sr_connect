/* SR V3 DIRECT ITEM SELECT - SELF CONTAINED */

window.srSEV3ItemSelectDirect =
async function(index){

  const state = window.srSEV3;

  if(
    !state ||
    !state.detail ||
    !Array.isArray(state.detail.materials)
  ){
    console.warn("SR V3: materials not ready");
    return;
  }

  const row = state.detail.materials[index];

  if(!row){
    console.warn("SR V3: row not found", index);
    return;
  }

  const originalCode = String(
    row.original_item_code ||
    row.item_code ||
    ""
  ).trim();

  if(!originalCode){
    return;
  }

  const old = document.querySelector(
    '[data-sr-direct-item-panel="1"]'
  );

  if(old){
    old.remove();
  }

  const panel = document.createElement("div");

  panel.setAttribute(
    "data-sr-direct-item-panel",
    "1"
  );

  panel.style.position = "fixed";
  panel.style.zIndex = "999999";
  panel.style.background = "#fff";
  panel.style.border = "1px solid #cbd5e1";
  panel.style.borderRadius = "12px";
  panel.style.boxShadow = "0 20px 50px rgba(0,0,0,.20)";
  panel.style.padding = "10px";
  panel.style.width = "320px";
  panel.style.maxWidth = "calc(100vw - 20px)";

  const cards = Array.from(
    document.querySelectorAll(
      '[data-sr-material-card="1"]'
    )
  );

  const card = cards[index];

  if(!card){
    return;
  }

  const button = card.querySelector(
    'button[title="Select Item"]'
  );

  if(!button){
    return;
  }

  const rect = button.getBoundingClientRect();

  panel.style.top =
    Math.min(
      rect.bottom + 6,
      window.innerHeight - 430
    ) + "px";

  panel.style.left =
    Math.max(
      10,
      Math.min(
        rect.left,
        window.innerWidth - 330
      )
    ) + "px";

  const search = document.createElement("input");

  search.type = "text";
  search.placeholder = "Search item code / name";
  search.style.width = "100%";
  search.style.boxSizing = "border-box";
  search.style.padding = "10px";
  search.style.border = "1px solid #cbd5e1";
  search.style.borderRadius = "10px";
  search.style.fontSize = "12px";
  search.style.marginBottom = "8px";

  const results = document.createElement("div");

  results.style.maxHeight = "330px";
  results.style.overflowY = "auto";

  panel.appendChild(search);
  panel.appendChild(results);

  document.body.appendChild(panel);

  let items = [];

  try{

    const response = await fetch(
      "/api/method/sr_connect.www.home.sr_stock_item_options_v3" +
      "?item_code=" +
      encodeURIComponent(originalCode)
    );

    const data = await response.json();

    if(
      !data ||
      !data.message ||
      data.message.success !== true
    ){
      throw new Error("Item options API failed");
    }

    items = Array.isArray(
      data.message.items
    )
      ? data.message.items
      : [];

  }catch(error){

    console.error(
      "SR V3 item picker:",
      error
    );

    results.innerHTML =
      '<div style="padding:12px;font-size:12px;color:#dc2626;">' +
      'Unable to load item list.' +
      '</div>';

    return;
  }

  function render(){

    const q = String(
      search.value || ""
    ).trim().toLowerCase();

    const matches = items.filter(
      function(item){

        return (
          String(item.name || "")
            .toLowerCase()
            .includes(q)
          ||
          String(item.item_name || "")
            .toLowerCase()
            .includes(q)
        );

      }
    );

    results.innerHTML = "";

    if(!matches.length){

      results.innerHTML =
        '<div style="padding:12px;font-size:12px;color:#64748b;">' +
        'No item found.' +
        '</div>';

      return;
    }

    matches.forEach(
      function(item){

        const option =
          document.createElement("button");

        option.type = "button";

        option.style.display = "block";
        option.style.width = "100%";
        option.style.textAlign = "left";
        option.style.padding = "10px";
        option.style.marginBottom = "6px";
        option.style.border = "1px solid #e2e8f0";
        option.style.borderRadius = "10px";
        option.style.background = "#fff";
        option.style.cursor = "pointer";

        const name =
          document.createElement("div");

        name.style.fontSize = "12px";
        name.style.fontWeight = "700";
        name.textContent =
          item.item_name ||
          item.name ||
          "";

        const code =
          document.createElement("div");

        code.style.fontSize = "10px";
        code.style.color = "#64748b";
        code.style.marginTop = "3px";
        code.textContent = item.name || "";

        option.appendChild(name);
        option.appendChild(code);

        option.addEventListener(
          "click",
          async function(e){

            e.preventDefault();
            e.stopPropagation();

            state.itemOverrides =
              state.itemOverrides || {};

            state.itemOverrides[originalCode] =
              item.name;

            panel.remove();

            await srSEV3OpenDetail(
              state.detail.work_order,
              false
            );

          }
        );

        results.appendChild(option);

      }
    );

  }

  search.addEventListener(
    "input",
    render
  );

  render();

  setTimeout(
    function(){
      search.focus();
    },
    0
  );

};


</script>

<script>
/* SR V3 CLEAN ITEM CODE PICKER */

window.srSEV3DirectItemPicker = async function(index, resultIndex){

  console.log(
    "SR PICKER TRACE:",
    "index=", index,
    "resultIndex=", resultIndex,
    "currentView=", currentView,
    "multiDetails=", Array.isArray(srSEV3 && srSEV3.multiDetails)
      ? srSEV3.multiDetails.length
      : "NO"
  );

  const state = srSEV3;

  let detail = state && state.detail;

  /*
   * Multi-batch mode:
   * use the detail belonging to this rendered batch,
   * not the global single-batch detail.
   */
  if(
    resultIndex !== null &&
    resultIndex !== undefined &&
    Array.isArray(state && state.multiDetails)
  ){
    detail = state.multiDetails[Number(resultIndex)];
  }

  if(
    !state ||
    !detail ||
    !Array.isArray(detail.materials)
  ){
    console.warn("SR V3: detail/materials not ready");
    return;
  }

  const rowIndex = Number(index);

  const row =
    detail.materials[rowIndex];

  if(!row){
    console.warn(
      "SR V3: material row not found",
      index
    );
    return;
  }

  const originalCode =
    String(
      row.original_item_code ||
      row.item_code ||
      ""
    ).trim();

  if(!originalCode){
    console.warn(
      "SR V3: original item code missing"
    );
    return;
  }

  /*
   * Find the actual rendered material card.
   * Do NOT depend on an element id.
   */
  let card;

  if(
    resultIndex !== null &&
    resultIndex !== undefined
  ){
    const section =
      document.querySelector(
        '[data-sr-multi-section="' +
        String(resultIndex) +
        '"]'
      );

    if(!section){
      console.warn(
        "SR V3: multi section not found",
        resultIndex
      );
      return;
    }

    const cards =
      Array.from(
        section.querySelectorAll(
          '[data-sr-material-card="1"]'
        )
      );

    card = cards[rowIndex];

    if(!card){
      console.warn(
        "SR V3: multi material card not found",
        rowIndex,
        cards.length,
        resultIndex
      );
      return;
    }

  }else{

    const cards =
      Array.from(
        document.querySelectorAll(
          '[data-sr-material-card="1"]'
        )
      );

    card = cards[rowIndex];

    if(!card){
      console.warn(
        "SR V3: material card not found",
        rowIndex,
        cards.length
      );
      return;
    }
  }

  /*
   * Find the Item Name button already rendered
   * inside this material card.
   */
  const button =
    card.querySelector(
      'button[title="Select Item"]'
    );

  if(!button){
    console.warn(
      "SR V3: Select Item button not found",
      index
    );
    return;
  }

  /*
   * Remove any existing picker.
   */
  const oldPanel =
    document.querySelector(
      '[data-sr-direct-item-panel="1"]'
    );

  if(oldPanel){
    oldPanel.remove();
  }

  /*
   * Create picker panel.
   */
  const panel =
    document.createElement("div");

  panel.setAttribute(
    "data-sr-direct-item-panel",
    "1"
  );

  panel.style.position = "fixed";
  panel.style.zIndex = "999999";
  panel.style.background = "#ffffff";
  panel.style.border = "1px solid #cbd5e1";
  panel.style.borderRadius = "12px";
  panel.style.boxShadow =
    "0 20px 50px rgba(0,0,0,.20)";
  panel.style.padding = "10px";
  panel.style.width = "320px";
  panel.style.maxWidth = "calc(100vw - 20px)";

  const rect =
    button.getBoundingClientRect();

  /*
   * Keep the picker completely inside the viewport.
   * Never use a negative top value.
   */
  const pickerHeight = 420;
  const pickerWidth = 330;
  const margin = 10;

  let top =
    rect.bottom + 6;

  if(
    top + pickerHeight >
    window.innerHeight - margin
  ){
    top =
      rect.top -
      pickerHeight -
      6;
  }

  top =
    Math.max(
      margin,
      Math.min(
        top,
        Math.max(
          margin,
          window.innerHeight -
          pickerHeight -
          margin
        )
      )
    );

  let left =
    rect.left;

  left =
    Math.max(
      margin,
      Math.min(
        left,
        Math.max(
          margin,
          window.innerWidth -
          pickerWidth -
          margin
        )
      )
    );

  panel.style.top =
    top + "px";

  panel.style.left =
    left + "px";

  /*
   * Search box.
   */
  const search =
    document.createElement("input");

  search.type = "text";

  search.placeholder =
    "Search item code / name";

  search.style.width = "100%";
  search.style.boxSizing = "border-box";
  search.style.padding = "10px";
  search.style.border =
    "1px solid #cbd5e1";
  search.style.borderRadius = "10px";
  search.style.fontSize = "12px";
  search.style.marginBottom = "8px";

  /*
   * Results area.
   */
  const results =
    document.createElement("div");

  results.style.maxHeight =
    "330px";

  results.style.overflowY =
    "auto";

  panel.appendChild(search);
  panel.appendChild(results);

  document.body.appendChild(panel);

  /*
   * Load ALL active stock items.
   */
  let items = [];

  try{

    const response =
      await fetch(
        "/api/method/sr_connect.www.home.sr_stock_item_options_v3" +
        "?item_code=" +
        encodeURIComponent(
          originalCode
        )
      );

    const data =
      await response.json();

    if(
      !data ||
      !data.message ||
      data.message.success !== true
    ){
      throw new Error(
        "Item options API failed"
      );
    }

    items =
      Array.isArray(
        data.message.items
      )
        ? data.message.items
        : [];

  }catch(error){

    console.error(
      "SR V3 item picker API error:",
      error
    );

    results.innerHTML =
      '<div style="padding:12px;font-size:12px;color:#dc2626;">' +
      'Unable to load item list.' +
      '</div>';

    return;
  }

  /*
   * Render item list.
   */
  function renderItems(){

    const q =
      String(
        search.value || ""
      )
      .trim()
      .toLowerCase();

    const matches =
      items.filter(
        function(item){

          return (
            String(
              item.name || ""
            )
            .toLowerCase()
            .includes(q)
            ||
            String(
              item.item_name || ""
            )
            .toLowerCase()
            .includes(q)
          );

        }
      );

    results.innerHTML = "";

    if(!matches.length){

      results.innerHTML =
        '<div style="padding:12px;font-size:12px;color:#64748b;">' +
        'No item found.' +
        '</div>';

      return;
    }

    matches.forEach(
      function(item){

        const option =
          document.createElement(
            "button"
          );

        option.type = "button";

        option.style.display =
          "block";

        option.style.width =
          "100%";

        option.style.textAlign =
          "left";

        option.style.padding =
          "10px";

        option.style.marginBottom =
          "6px";

        option.style.border =
          "1px solid #e2e8f0";

        option.style.borderRadius =
          "10px";

        option.style.background =
          "#ffffff";

        option.style.cursor =
          "pointer";

        const name =
          document.createElement(
            "div"
          );

        name.style.fontSize =
          "12px";

        name.style.fontWeight =
          "700";

        name.textContent =
          item.item_name ||
          item.name ||
          "";

        const code =
          document.createElement(
            "div"
          );

        code.style.fontSize =
          "10px";

        code.style.color =
          "#64748b";

        code.style.marginTop =
          "3px";

        code.textContent =
          item.name || "";

        option.appendChild(name);
        option.appendChild(code);

        option.addEventListener(
          "click",
          async function(event){

            event.preventDefault();
            event.stopPropagation();

            state.itemOverrides =
              state.itemOverrides ||
              {};

            state.itemOverrides[
              originalCode
            ] =
              item.name;

            panel.remove();

            /*
             * MULTI MODE:
             * Keep the user on the Multi Detail screen.
             * Apply the selected item to every matching
             * material card without reloading the page.
             */
            if(
              currentView ===
                "stockEntryMultiDetailV3" &&
              Array.isArray(
                state.multiDetails
              )
            ){

              const sections =
                Array.from(
                  document.querySelectorAll(
                    '[data-sr-multi-section]'
                  )
                );

              sections.forEach(
                function(section){

                  const cards =
                    Array.from(
                      section.querySelectorAll(
                        '[data-sr-material-card="1"]'
                      )
                    );

                  cards.forEach(
                    function(card){

                      const cardOriginal =
                        String(
                          card.getAttribute(
                            "data-sr-original-item-code"
                          ) || ""
                        ).trim();

                      if(
                        cardOriginal !==
                        originalCode
                      ){
                        return;
                      }

                      const label =
                        card.querySelector(
                          '[data-sr-item-picker="1"] button span'
                        ) ||
                        card.querySelector(
                          '[data-sr-item-picker="1"] span'
                        );

                      if(label){
                        label.textContent =
                          item.item_name ||
                          item.name ||
                          "";
                      }

                      card.setAttribute(
                        "data-sr-item-code",
                        item.name
                      );
                    }
                  );

                }
              );

              return;
            }

            /*
             * SINGLE MODE:
             * Keep the existing behaviour unchanged.
             */
            await srSEV3OpenDetail(
              state.detail.work_order,
              false
            );

          }
        );

        results.appendChild(
          option
        );

      }
    );

  }

  search.addEventListener(
    "input",
    renderItems
  );

  renderItems();

  setTimeout(
    function(){
      search.focus();
    },
    0
  );

  /*
   * Close picker when clicking outside.
   */
  function closePicker(event){

    if(
      panel.contains(event.target) ||
      button.contains(event.target)
    ){
      return;
    }

    panel.remove();

    document.removeEventListener(
      "click",
      closePicker,
      true
    );

  }

  setTimeout(
    function(){

      document.addEventListener(
        "click",
        closePicker,
        true
      );

    },
    0
  );

}
</script>

<script>
/* SR V3 ITEM SELECT PATCH */

(function(){

  function srV3InstallSafeItemSelect(){

    if(
      !window.srSEV3 ||
      !srSEV3.detail ||
      !Array.isArray(srSEV3.detail.materials)
    ){
      return;
    }

    srSEV3.detail.materials.forEach(function(row,index){

      const card =
        document.getElementById("srSEV3Material_" + index);

      if(!card){
        return;
      }

      if(card.querySelector('[data-sr-item-name-select="1"]')){
        return;
      }

      const originalCode =
        String(
          row.original_item_code ||
          row.item_code ||
          ""
        ).trim();

      const selectedCode =
        String(
          row.selected_item_code ||
          row.item_code ||
          originalCode
        ).trim();

      const oldName =
        card.querySelector(
          '[data-sr-item-code]'
        );

      /*
       * Find the material item-name area.
       */
      let target = null;

      const candidates =
        Array.from(
          card.querySelectorAll(
            "button, div, span"
          )
        );

      target =
        candidates.find(function(el){

          const text =
            String(el.textContent || "").trim();

          return (
            text === String(
              row.item_name ||
              originalCode
            ).trim()
          );

        }) || oldName;

      if(!target){
        console.warn(
          "SR V3: item name target not found",
          index,
          originalCode
        );
        return;
      }

      const host =
        document.createElement("div");

      host.setAttribute(
        "data-sr-item-name-select",
        "1"
      );

      host.className =
        "w-full relative";

      host.innerHTML =
        '<select ' +
        'data-sr-item-name-select-control="1" ' +
        'class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold bg-white cursor-pointer">' +
        '<option value="">Loading...</option>' +
        '</select>';

      target.replaceWith(host);

      const select =
        host.querySelector(
          '[data-sr-item-name-select-control="1"]'
        );

      if(!select){
        return;
      }

      fetch(
        "/api/method/sr_connect.www.home.sr_stock_item_options_v3" +
        "?item_code=" +
        encodeURIComponent(originalCode)
      )
      .then(function(response){
        return response.json();
      })
      .then(function(payload){

        const result =
          payload.message || payload;

        const items =
          Array.isArray(result.items)
            ? result.items
            : [];

        const all = [];

        all.push({
          name: originalCode,
          item_name:
            row.item_name ||
            originalCode
        });

        items.forEach(function(item){

          const code =
            String(
              item.name ||
              item.item_code ||
              ""
            ).trim();

          if(!code){
            return;
          }

          if(
            all.some(function(x){
              return x.name === code;
            })
          ){
            return;
          }

          all.push(item);

        });

        select.innerHTML = "";

        all.forEach(function(item){

          const code =
            String(
              item.name ||
              item.item_code ||
              ""
            ).trim();

          if(!code){
            return;
          }

          const option =
            document.createElement("option");

          option.value = code;

          option.textContent =
            (item.item_name || code) +
            "  (" +
            code +
            ")";

          if(code === selectedCode){
            option.selected = true;
          }

          select.appendChild(option);

        });

      })
      .catch(function(error){

        console.error(
          "SR V3 item selector:",
          error
        );

        select.innerHTML =
          '<option value="' +
          escapeAttr(originalCode) +
          '">' +
          escapeHtml(
            row.item_name ||
            originalCode
          ) +
          '</option>';

      });

      select.addEventListener(
        "change",
        async function(){

          const newCode =
            String(
              select.value ||
              ""
            ).trim();

          if(!newCode){
            return;
          }

          if(
            newCode ===
            String(
              row.item_code ||
              ""
            ).trim()
          ){
            return;
          }

          srSEV3.itemOverrides =
            srSEV3.itemOverrides ||
            {};

          srSEV3.itemOverrides[
            originalCode
          ] = newCode;

          srSEV3.selectedBatches =
            srSEV3.selectedBatches ||
            {};

          delete srSEV3.selectedBatches[
            originalCode
          ];

          delete srSEV3.selectedBatches[
            String(
              row.item_code ||
              ""
            ).trim()
          ];

          try{

            const params =
              new URLSearchParams();

            params.set(
              "work_order_id",
              srSEV3.workOrder ||
              srSEV3.work_order ||
              ""
            );

            params.set(
              "item_overrides",
              JSON.stringify(
                srSEV3.itemOverrides
              )
            );

            const response =
              await fetch(
                "/api/method/sr_connect.www.home.sr_stock_entry_detail_v3?" +
                params.toString()
              );

            const payload =
              await response.json();

            const result =
              payload.message ||
              payload;

            if(
              !result ||
              !Array.isArray(result.materials)
            ){
              throw new Error(
                "Invalid Stock Entry detail response."
              );
            }

            srSEV3.detail = result;

            if(
              typeof srSEV3RenderDetail ===
              "function"
            ){
              srSEV3RenderDetail(result);
              return;
            }

            if(
              typeof srSEV3OpenDetail ===
              "function"
            ){
              await srSEV3OpenDetail(
                srSEV3.workOrder ||
                srSEV3.work_order
              );
              return;
            }

            window.location.reload();

          }catch(error){

            console.error(
              "SR V3 item change failed:",
              error
            );

            alert(
              error.message ||
              "Unable to change item."
            );

          }

        }
      );

    });

  }

  /*
   * Install after the existing V3 detail renderer
   * has created the material cards.
   */
  const oldOpen =
    window.srSEV3OpenDetail;

  if(
    typeof oldOpen === "function" &&
    !oldOpen["_srItemSelectWrapped"]
  ){

    const wrapped =
      async function(){

        const result =
          await oldOpen.apply(
            this,
            arguments
          );

        setTimeout(
          function(){
            srV3InstallSafeItemSelect();
          },
          50
        );

        return result;
      };

    wrapped["_srItemSelectWrapped"] =
      true;

    window.srSEV3OpenDetail =
      wrapped;
  }

  /*
   * Also try once immediately.
   */
  setTimeout(
    srV3InstallSafeItemSelect,
    1000
  );

})();
</script>


<script>
(function(){

  function srForceBatchFieldLock(){

    const fields = Array.from(
      document.querySelectorAll(
        'input[id="woNewBatch"], input[data-fieldname="custom_new_batch_id"]'
      )
    );

    if(!fields.length) return;

    const wo =
      window.selectedWorkOrder ||
      window.srSelectedWorkOrder ||
      window.srCreatedWorkOrder ||
      null;

    let status = "";

    if(wo){
      status = String(wo.status || "").trim();
    }

    /*
     * Fallback: read visible Work Order status text from page.
     */
    if(!status){
      const txt = document.body.innerText || "";

      if(/\bIn Process\b/i.test(txt)){
        status = "In Process";
      }else if(/\bCompleted\b/i.test(txt)){
        status = "Completed";
      }else if(/\bNot Started\b/i.test(txt)){
        status = "Not Started";
      }
    }

    const canEdit =
      status === "" || status === "Not Started";

    fields.forEach(function(el){

      el.disabled = !canEdit;
      el.readOnly = !canEdit;

      if(canEdit){
        el.removeAttribute("aria-readonly");
        el.style.pointerEvents = "";
        el.style.opacity = "";
        el.style.background = "";
        el.style.cursor = "";
      }else{
        el.setAttribute("aria-readonly", "true");
        el.style.pointerEvents = "none";
        el.style.opacity = "0.65";
        el.style.background = "#f3f4f6";
        el.style.cursor = "not-allowed";
      }
    });

    console.log(
      "SR FORCE BATCH LOCK:",
      status,
      canEdit,
      fields.length
    );
  }

  window.srForceBatchFieldLock = srForceBatchFieldLock;

  /*
   * Apply immediately and after every UI redraw.
   */
  srForceBatchFieldLock();

  setTimeout(srForceBatchFieldLock, 100);
  setTimeout(srForceBatchFieldLock, 500);
  setTimeout(srForceBatchFieldLock, 1000);
  setTimeout(srForceBatchFieldLock, 2000);

  /*
   * Catch SR Connect's dynamic re-rendering.
   */
  const observer = new MutationObserver(function(){
    srForceBatchFieldLock();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>

<script>
/* ========================================================
   SR CONNECT - UNIVERSAL ERPNext ROLE PERMISSION ENGINE
   ======================================================== */

window.srRolePermissions = {};
window.srRolePermissionsLoaded = false;

window.srLoadRolePermissions = async function () {
    try {
        const r = await fetch(
            "/api/method/sr_connect.www.home.get_sr_role_permissions",
            {
                credentials: "same-origin"
            }
        );

        const data = await r.json();

        window.srRolePermissions =
            (data && data.message) || {};

        window.srRolePermissionsLoaded = true;

        window.srApplyRolePermissions();

        return window.srRolePermissions;

    } catch (e) {
        console.error(
            "SR Connect permission load failed:",
            e
        );

        window.srRolePermissions = {};
        window.srRolePermissionsLoaded = false;

        return {};
    }
};


window.srCan = function (doctype, permission) {
    if (!window.srRolePermissionsLoaded) {
        return false;
    }

    const d =
        window.srRolePermissions[doctype] || {};

    return !!d[String(permission || "read").toLowerCase()];
};


window.srRequirePermission = async function (
    doctype,
    permission
) {
    permission =
        String(permission || "read").toLowerCase();

    if (window.srRolePermissionsLoaded) {
        if (!window.srCan(doctype, permission)) {
            frappe.msgprint(
                __("You do not have {0} permission for {1}.", [
                    permission,
                    doctype
                ])
            );

            return false;
        }

        return true;
    }

    try {
        const url =
            "/api/method/sr_connect.www.home.check_sr_permission" +
            "?doctype=" +
            encodeURIComponent(doctype) +
            "&ptype=" +
            encodeURIComponent(permission);

        const r = await fetch(url, {
            credentials: "same-origin"
        });

        const data = await r.json();

        const allowed =
            !!(
                data &&
                data.message &&
                data.message.allowed
            );

        if (!allowed) {
            frappe.msgprint(
                __("You do not have {0} permission for {1}.", [
                    permission,
                    doctype
                ])
            );
        }

        return allowed;

    } catch (e) {
        console.error(
            "SR permission check failed:",
            e
        );

        return false;
    }
};


/*
 * Hide buttons/actions according to ERPNext permissions.
 * This is generic and does not depend on Employee names.
 */
window.srApplyRolePermissions = function () {

    if (!window.srRolePermissionsLoaded) {
        return;
    }

    const current =
        String(window.currentDocType || "").trim();

    if (!current) {
        return;
    }

    const p =
        window.srRolePermissions[current] || {};

    /*
     * CREATE
     */
    document
        .querySelectorAll(
            "#woCreateButton, [data-sr-create-button]"
        )
        .forEach(btn => {
            btn.style.display =
                p.create ? "" : "none";
        });

    /*
     * WRITE / EDIT
     */
    document
        .querySelectorAll(
            "[data-sr-edit-button], " +
            "[data-sr-update-button], " +
            "#srWorkOrderBatchEdit, " +
            "#srWorkOrderBatchSave, " +
            "#srWorkOrderBatchUpdate"
        )
        .forEach(btn => {
            btn.style.display =
                p.write ? "" : "none";
        });

    /*
     * SUBMIT
     */
    document
        .querySelectorAll(
            "[data-sr-submit-button]"
        )
        .forEach(btn => {
            btn.style.display =
                p.submit ? "" : "none";
        });

    /*
     * CANCEL
     */
    document
        .querySelectorAll(
            "[data-sr-cancel-button]"
        )
        .forEach(btn => {
            btn.style.display =
                p.cancel ? "" : "none";
        });
};


/*
 * Work Order Create button:
 * ERPNext CREATE permission is the only authority.
 */
window.ensureWorkOrderCreateButton =
    (function (original) {

        return async function () {

            if (
                window.currentDocType ===
                    "Work Order" &&
                window.currentView === "list"
            ) {

                const allowed =
                    await window.srRequirePermission(
                        "Work Order",
                        "create"
                    );

                if (!allowed) {
                    if (
                        typeof window
                            .removeWorkOrderCreateButton ===
                        "function"
                    ) {
                        window
                            .removeWorkOrderCreateButton();
                    }

                    return;
                }
            }

            if (typeof original === "function") {
                return original.apply(
                    this,
                    arguments
                );
            }
        };

    })(window.ensureWorkOrderCreateButton);


/*
 * Protect navigation:
 * If Read permission is missing, clicking the page
 * is blocked and the page is hidden when possible.
 */
window.srPermissionNavigationGuard = function () {

    const map = {
        "Work Order": "Work Order",
        "Job Card": "Job Card",
        "Stock Entry": "Stock Entry",
        "Quality Inspection": "Quality Inspection",
        "Item": "Item",
        "BOM": "BOM",
        "Batch": "Batch",
        "Warehouse": "Warehouse",
        "Employee": "Employee",
        "User": "User"
    };

    Object.keys(map).forEach(label => {

        const doctype = map[label];

        if (window.srCan(doctype, "read")) {
            return;
        }

        document
            .querySelectorAll("button, a, [role='button']")
            .forEach(el => {

                const text =
                    String(
                        el.innerText ||
                        el.textContent ||
                        ""
                    ).trim();

                if (text === label) {
                    el.style.display = "none";
                }
            });
    });
};


/*
 * Load permission immediately.
 */
(function () {

    const start = async function () {

        await window.srLoadRolePermissions();

        window.srApplyRolePermissions();

        window.srPermissionNavigationGuard();

    };

    if (
        document.readyState === "loading"
    ) {
        document.addEventListener(
            "DOMContentLoaded",
            start
        );
    } else {
        start();
    }

})();


/*
 * Re-apply after SR Connect changes page/list.
 */
const srPermissionObserver =
    new MutationObserver(function () {

        if (
            window.srRolePermissionsLoaded
        ) {
            window.srApplyRolePermissions();
            window.srPermissionNavigationGuard();
        }

    });

srPermissionObserver.observe(
    document.body,
    {
        childList: true,
        subtree: true
    }
);


function srSEV3ShowError(message) {
  const msg = String(message || "Stock Entry failed.");

  if (typeof frappe !== "undefined" && frappe.msgprint) {
    frappe.msgprint({
      title: "Stock Entry",
      message: msg,
      indicator: "red"
    });
    return;
  }

  alert(msg);
}




async function srSEV3CreateSelectedStockEntry(){

  const rows =
    Array.isArray(
      srSEV3.selectedStockEntryRows
    )
      ? srSEV3.selectedStockEntryRows
      : [];

  if(!rows.length){
    return;
  }

  /*
   * Read ONLY the rows displayed on this page.
   */
  rows.forEach(function(row,index){

    const qty =
      document.querySelector(
        '[data-sr-stock-qty="' + index + '"]'
      );

    const batch =
      document.querySelector(
        '[data-sr-stock-batch="' + index + '"]'
      );

    row.stock_qty =
      qty
        ? Number(qty.value || 0)
        : Number(row.required_qty || 0);

    row.batch_no =
      batch
        ? String(batch.value || "").trim()
        : String(row.batch_no || "").trim();

  });

  const grouped = {};

  rows.forEach(function(row){

    if(!row.stock_qty || row.stock_qty <= 0){
      return;
    }

    if(
      row.has_batch_no &&
      !row.batch_no
    ){
      return;
    }

    if(!grouped[row.work_order]){
      grouped[row.work_order] = [];
    }

    grouped[row.work_order].push({
      item_code:
        row.item_code,

      batch_no:
        row.batch_no,

      qty:
        row.stock_qty
    });

  });

  const workOrders =
    Object.keys(grouped);

  if(!workOrders.length){

    if(typeof srSEV3ShowError === "function"){
      srSEV3ShowError(
        "Please enter Stock Qty and Batch for the selected items."
      );
    }else{
      alert(
        "Please enter Stock Qty and Batch for the selected items."
      );
    }

    return;
  }

  /*
   * IMPORTANT:
   * Do NOT auto-submit here.
   *
   * This button only moves to the native/custom Stock Entry
   * creation stage with the selected rows.
   *
   * Existing backend submit logic remains untouched.
   */

  const first =
    workOrders[0];

  const materials =
    grouped[first];

  const result =
    await api(
      "/api/method/sr_connect.www.home.sr_stock_entry_submit_v3",
      {
        method:"POST",
        body:JSON.stringify({
          work_order_id:first,
          materials:materials
        })
      }
    );

  if(result && result.name){

    window.location.href =
      "/app/stock-entry/" +
      encodeURIComponent(
        result.name
      );

  }

}

      );

  }

}



async function srSEV3SubmitMulti(){

  const details =
    Array.isArray(srSEV3.multiDetails)
      ? srSEV3.multiDetails
      : [];

  const workOrders =
    Array.isArray(srSEV3.multiWorkOrders)
      ? srSEV3.multiWorkOrders
      : [];

  if(!details.length || !workOrders.length){
    alert("Please select at least one Batch.");
    return;
  }

  const submissions = [];
  const insufficientStock = [];

  /*
   * Reuse the SAME payload structure used by
   * the working single-batch submit.
   *
   * Each multi card is identified by:
   *   data-sr-multi-result
   *   data-sr-multi-index
   */

  details.forEach(function(detail,resultIndex){

    const workOrder =
      workOrders[resultIndex];

    const materials =
      Array.isArray(detail.materials)
        ? detail.materials
        : [];

    materials.forEach(function(row,index){

      const originalItemCode =
        String(
          row.original_item_code ||
          row.item_code ||
          ""
        ).trim();

      const selectedItem =
        String(
          (
            srSEV3.itemOverrides &&
            srSEV3.itemOverrides[originalItemCode]
          ) ||
          row.item_code ||
          ""
        ).trim();

      /*
       * IMPORTANT:
       * Multi cards are rendered inside their own
       * Work Order section. Resolve the card from
       * THAT section first, then use material index.
       */
      const section =
        document.querySelector(
          '[data-sr-multi-section="' +
          resultIndex +
          '"]'
        );

      const card =
        section
          ? section.querySelectorAll(
              '[data-sr-material-card="1"]'
            )[index]
          : null;

      if(!card){
        console.warn(
          "MULTI: card not found",
          resultIndex,
          index
        );
        return;
      }

      const warehouse =
        card.querySelector(
          '[data-sr-role="warehouse"]'
        );

      const batch =
        card.querySelector(
          '[data-sr-role="batch"]'
        );

      const sourceWarehouse =
        warehouse
          ? String(
              warehouse.value || ""
            ).trim()
          : String(
              row.source_warehouse || ""
            ).trim();

      const batchNo =
        batch
          ? String(
              batch.value || ""
            ).trim()
          : "";

      const required =
        Number(
          row.remaining_qty || 0
        );

      /*
       * IMPORTANT:
       * If the selected batch does not have enough stock,
       * block the ENTIRE Multi submission.
       */
      if(
        batchNo &&
        Array.isArray(row.batches)
      ){
        const selectedBatch =
          row.batches.find(function(b){
            return String(
              b.batch_no || ""
            ).trim() === batchNo;
          });

        if(selectedBatch){
          const availableQty =
            Number(
              selectedBatch.available_qty || 0
            );

          if(availableQty < required){
            insufficientStock.push({
              item: selectedItem,
              batch: batchNo,
              available: availableQty,
              required: required
            });

            return;
          }
        }
      }

      /*
       * IMPORTANT:
       * Multi mode skips only the invalid material.
       * Other valid materials/batches continue.
       */
      if(
        !originalItemCode ||
        !selectedItem ||
        !sourceWarehouse ||
        required <= 0
      ){
        console.warn(
          "MULTI: skipped incomplete row",
          {
            workOrder,
            index,
            originalItemCode,
            selectedItem,
            sourceWarehouse,
            required
          }
        );
        return;
      }

      /*
       * Batch-controlled item:
       * use the batch selected on THIS card.
       *
       * Do not reject the whole Multi submission
       * because another batch/material is unavailable.
       */
      if(
        Number(row.has_batch_no || 0) === 1 &&
        !batchNo
      ){
        console.warn(
          "MULTI: skipped row without batch",
          {
            workOrder,
            index,
            originalItemCode
          }
        );
        return;
      }

      submissions.push({
        workOrder: workOrder,
        item: {
          original_item_code:
            originalItemCode,

          item_code:
            selectedItem,

          qty:
            required,

          batch_no:
            batchNo,

          source_warehouse:
            sourceWarehouse
        }
      });

    });

  });

  if(insufficientStock.length){
    const message =
      insufficientStock.map(function(x){
        return (
          x.item +
          " / Batch: " +
          x.batch +
          " / Available: " +
          x.available +
          " / Required: " +
          x.required
        );
      }).join("\n");

    alert(
      "Insufficient stock. Stock Entry was NOT submitted.\n\n" +
      message
    );

    return;
  }

  if(!submissions.length){
    alert(
      "No valid material/batch combination found."
    );
    return;
  }

  const grouped = {};

  submissions.forEach(function(entry){

    if(!grouped[entry.workOrder]){
      grouped[entry.workOrder] = [];
    }

    grouped[entry.workOrder].push(
      entry.item
    );

  });

  const button =
    document.getElementById(
      "srSEV3MultiSubmitButton"
    );

  if(button){
    button.disabled = true;
    button.innerText = "SUBMITTING...";
  }

  let submitSucceeded = false;

  try{

    const workOrderIds =
      Object.keys(grouped);

    for(
      const workOrder of workOrderIds
    ){

      await api(
        "/api/method/sr_connect.www.home.create_stock_entry_from_work_order",
        {
          method: "POST",

          body: JSON.stringify({
            work_order_id:
              workOrder,

            items:
              grouped[workOrder]
          })
        }
      );

    }

    submitSucceeded = true;

    if(button){
      button.disabled = true;
      button.innerText = "SUBMITTED";

      button.onclick = function(event){
        event.preventDefault();
        event.stopPropagation();
        return false;
      };

      button.classList.add(
        "bg-green-600",
        "cursor-not-allowed",
        "opacity-75"
      );
    }

    alert(
      "Stock Entry submitted successfully."
    );

  }catch(e){

    console.error(
      "MULTI STOCK ENTRY SUBMIT ERROR:",
      e
    );

    alert(
      e && e.message
        ? e.message
        : "Unable to submit Stock Entry."
    );

  }finally{

    if(button && !submitSucceeded){
      button.disabled = false;
      button.innerText = "SAVE & SUBMIT";
    }

  }

}


/*
 * Multi-item picker.
 *
 * It temporarily points srSEV3.detail at the selected Work Order,
 * then uses the EXISTING proven item picker.
 *
 * After selection, only that Work Order section is reloaded.
 */
window.srSEV3MultiItemPicker =
async function(resultIndex,index){

  const details =
    Array.isArray(
      srSEV3.multiDetails
    )
      ? srSEV3.multiDetails
      : [];

  const detail =
    details[resultIndex];

  if(
    !detail ||
    !Array.isArray(detail.materials)
  ){
    return;
  }

  const row =
    detail.materials[index];

  if(!row){
    return;
  }

  const originalItemCode =
    String(
      row.original_item_code ||
      row.item_code ||
      ""
    ).trim();

  if(!originalItemCode){
    return;
  }

  const oldDetail =
    srSEV3.detail;

  srSEV3.detail =
    detail;

  try{

    /*
     * Use the existing item picker for the exact
     * material that the user clicked.
     */
    await srSEV3DirectItemPicker(
      index,
      resultIndex
    );

  }finally{

    srSEV3.detail =
      oldDetail ||
      detail;

  }

  const selectedItem =
    String(
      (
        srSEV3.itemOverrides &&
        srSEV3.itemOverrides[originalItemCode]
      ) ||
      ""
    ).trim();

  if(!selectedItem){
    return;
  }

  /*
   * Keep ONE override for this original material.
   * Every selected batch uses the same item.
   */
  if(!srSEV3.itemOverrides){
    srSEV3.itemOverrides = {};
  }

  srSEV3.itemOverrides[originalItemCode] =
    selectedItem;

  /*
   * Update every selected batch currently on screen.
   * Do NOT call srSEV3SubmitSelected() here.
   *
   * That API refresh was causing:
   *   home:11 Unexpected token '<'
   */
  const sections =
    Array.from(
      document.querySelectorAll(
        '[data-sr-multi-section]'
      )
    );

  sections.forEach(function(section){

    const cards =
      Array.from(
        section.querySelectorAll(
          '[data-sr-material-card="1"]'
        )
      );

    cards.forEach(function(card){

      const cardOriginal =
        String(
          card.getAttribute(
            "data-sr-original-item-code"
          ) ||
          ""
        ).trim();

      if(
        cardOriginal !== originalItemCode
      ){
        return;
      }

      /*
       * Update visible item label.
       */
      const label =
        card.querySelector(
          '[data-sr-item-picker="1"] button span'
        ) ||
        card.querySelector(
          '[data-sr-item-picker="1"] span'
        );

      if(label){
        label.textContent =
          selectedItem;
      }

      /*
       * Keep the card's current item code
       * synchronized for submit.
       */
      card.setAttribute(
        "data-sr-item-code",
        selectedItem
      );

    });

  });

};

</script>






<script>
/* SR_JOB_CARD_GROUP_DECORATOR_V1 */
(function(){

  function srJCStatus(o){
    if(Number(o.docstatus) === 1) return "Completed";
    if(o.category === "Completed" || o.status === "Completed") return "Completed";
    if(o.running) return "In Process";
    if(Number(o.elapsed_seconds || 0) > 0) return "In Process";
    return "Not Started";
  }

  function srJCEscape(v){
    if(typeof escapeHtml === "function"){
      return escapeHtml(v == null ? "" : String(v));
    }

    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function srJCAttr(v){
    if(typeof escapeAttr === "function"){
      return escapeAttr(v == null ? "" : String(v));
    }

    return srJCEscape(v)
      .replace(/`/g,"&#096;");
  }

  function srJCFormatSeconds(total){

    if(typeof formatSeconds === "function"){
      return formatSeconds(total);
    }

    total = Math.max(0, Number(total || 0));

    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const sec = Math.floor(total % 60);

    return [
      String(h).padStart(2,"0"),
      String(m).padStart(2,"0"),
      String(sec).padStart(2,"0")
    ].join(":");
  }

  function srJCDate(o){
    const value = o.creation || o.modified || "";
    const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}-${m[2]}-${m[1]}` : "NO DATE";
  }

  function srJCMatchesSearch(o){

    const search =
      ((document.getElementById("search") || {}).value || "")
        .toLowerCase()
        .trim();

    const batchSearch =
      ((document.getElementById("batchSearch") || {}).value || "")
        .toLowerCase()
        .trim();

    const mainMatch =
      !search ||
      [
        o.name,
        o.job_card_no,
        o.item_name,
        o.operation,
        o.production_item,
        o.work_order,
        o.item_code
      ].some(v =>
        String(v || "")
          .toLowerCase()
          .includes(search)
      );

    const batchMatch =
      !batchSearch ||
      String(o.batch_no || "")
        .toLowerCase()
        .includes(batchSearch);

    return mainMatch && batchMatch;
  }

  function srJCSortJobs(a,b){

    return Number(
      a.operation_idx ||
      a.idx ||
      999999
    ) -
    Number(
      b.operation_idx ||
      b.idx ||
      999999
    );
  }

  function srJCNotStarted(){

    if(
      typeof rawItems === "undefined" ||
      !Array.isArray(rawItems)
    ) return;

    const box =
      document.getElementById("listContainer");

    if(!box) return;

    const items =
      rawItems.filter(o =>
        srJCStatus(o) === "Not Started" &&
        srJCMatchesSearch(o)
      );

    if(!items.length){
      box.innerHTML =
        "<div class='text-center py-10 text-xs text-slate-400'>" +
        "No records found." +
        "</div>";
      return;
    }

    const dates = {};

    items.forEach(o => {

      const date = srJCDate(o);

      const batch =
        String(o.batch_no || "")
          .trim() || "NO BATCH";

      if(!dates[date]){
        dates[date] = {};
      }

      if(!dates[date][batch]){
        dates[date][batch] = [];
      }

      dates[date][batch].push(o);

    });

    const dateKeys =
      Object.keys(dates).sort((a,b) =>
        b.localeCompare(a)
      );

    box.innerHTML =
      dateKeys.map(date => {

        const batches =
          Object.keys(dates[date]).sort();

        return `
          <div class="mb-5">

            <div class="space-y-2">

              ${batches.map(batch => {

                const jobs =
                  dates[date][batch]
                    .slice()
                    .sort(srJCSortJobs);

                const item =
                  jobs[0]?.item_name ||
                  jobs[0]?.item_code ||
                  jobs[0]?.production_item ||
                  "-";

                return `
                  <div class="bg-white border rounded-2xl p-4 shadow-sm">

                    <div class="flex items-center justify-between gap-3 pb-3 border-b">

                      <div class="shrink-0">

                        <div class="text-[9px] text-slate-400 uppercase font-bold">
                          Batch No
                        </div>

                        <div class="text-lg font-bold text-slate-800">
                          ${srJCEscape(batch)}
                        </div>

                        <div class="text-[10px] text-slate-500 mt-1">
                          Item: ${srJCEscape(item)}
                        </div>

                      </div>

                      <div class="flex items-center gap-1 text-[10px] font-bold whitespace-nowrap mb-1">
                        <span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded-full">
                          MFG DATE : ${srJCEscape(String(jobs[0]?.custom_date || "").slice(0,10).split("-").reverse().join("-"))}
                        </span>
                        <span class="text-slate-400">|</span>
                        <span class="bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full">
                          EXP DATE : ${srJCEscape(String(jobs[0]?.custom_exp_date || "").slice(0,10).split("-").reverse().join("-"))}
                        </span>
                      </div>

                    </div>

                    <div class="mt-2">

                      ${jobs.map((j,i) => `

                        <div
                          onclick="openJob('${srJCAttr(j.name)}')"
                          class="flex items-center justify-between gap-2 py-2 border-b last:border-b-0 cursor-pointer active:scale-[.99]"
                        >

                          <div class="text-xs text-slate-700 min-w-0">
                            <b>Job ${i + 1}</b>
                            <span class="mx-2">:</span>
                            ${srJCEscape(j.operation || "-")}
                          </div>

                          <span class="px-2 py-1 rounded-full bg-amber-100 text-amber-700 text-[9px] font-bold whitespace-nowrap">
                            IN PROCESS
                          </span>

                        </div>

                      `).join("")}

                    </div>

                  </div>
                `;

              }).join("")}

            </div>

          </div>
        `;

      }).join("");
  }


  function srJCCompleted(){

    if(
      typeof rawItems === "undefined" ||
      !Array.isArray(rawItems)
    ) return;

    const box =
      document.getElementById("listContainer");

    if(!box) return;

    const items =
      rawItems.filter(o =>
        srJCStatus(o) === "Completed" &&
        srJCMatchesSearch(o)
      );

    if(!items.length){
      box.innerHTML =
        "<div class='text-center py-10 text-xs text-slate-400'>" +
        "No records found." +
        "</div>";
      return;
    }

    const groups = {};

    items.forEach(o => {

      const batch =
        String(o.batch_no || "")
          .trim() || "NO BATCH";

      if(!groups[batch]){
        groups[batch] = [];
      }

      groups[batch].push(o);

    });

    box.innerHTML =
      Object.keys(groups).map(batch => {

        const jobs =
          groups[batch]
            .slice()
            .sort(srJCSortJobs);

        const item =
          jobs[0]?.item_name ||
          jobs[0]?.item_code ||
          jobs[0]?.production_item ||
          "-";

        const totalSeconds =
          jobs.reduce(
            (sum,j) =>
              sum + Number(j.elapsed_seconds || 0),
            0
          );

        return `
          <div class="bg-white border rounded-2xl p-4 shadow-sm mb-3">

            <div class="flex items-center justify-between gap-3 pb-3 border-b">

              <div class="shrink-0">

                <div class="text-[9px] text-slate-400 uppercase font-bold">
                  Batch No
                </div>

                <div class="text-lg font-bold text-slate-800">
                  ${srJCEscape(batch)}
                </div>

                <div class="text-[10px] text-slate-500 mt-1">
                  Item: ${srJCEscape(item)}
                </div>

              </div>

              <div class="flex items-center gap-1 text-[10px] font-bold whitespace-nowrap mb-1">
                <span class="text-green-700">
                  MFG DATE : ${srJCEscape(String(jobs[0]?.custom_date || "").slice(0,10).split("-").reverse().join("-"))}
                </span>
                <span class="text-slate-400">|</span>
                <span class="text-red-600">
                  EXP DATE : ${srJCEscape(String(jobs[0]?.custom_exp_date || "").slice(0,10).split("-").reverse().join("-"))}
                </span>
              </div>

            </div>

            <div class="mt-2">

              ${jobs.map((j,i) => {

                return `
                  <div
                    onclick="openJob('${srJCAttr(j.name)}')"
                    class="flex items-center justify-between gap-2 py-2 border-b last:border-b-0 cursor-pointer active:scale-[.99]"
                  >

                    <div class="text-xs text-slate-700 min-w-0">
                      <b>Job ${i + 1}</b>
                      <span class="mx-2">:</span>
                      ${srJCEscape(j.operation || "-")}
                    </div>

                    <span class="px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 text-[9px] font-bold whitespace-nowrap">
                      COMPLETED
                    </span>

                  </div>
                `;

              }).join("")}

            </div>

            <div class="mt-3 pt-3 border-t text-xs font-bold text-slate-700">
              Total Time Used :
              ${srJCEscape(srJCFormatSeconds(totalSeconds))}
              hrs
            </div>

          </div>
        `;

      }).join("");
  }


  function srJCApply(){

    if(
      typeof currentDocType === "undefined" ||
      currentDocType !== "Job Card"
    ) return;

    if(
      typeof jobFilter === "undefined"
    ) return;

    if(jobFilter === "Not Started"){
      srJCNotStarted();
      return;
    }

    if(jobFilter === "Completed"){
      srJCCompleted();
      return;
    }

  }


  function srJCInstall(){

    if(
      typeof window.renderList !== "function" ||
      window.renderList.srJCWrapped
    ) return;

    const original =
      window.renderList;

    async function wrappedRenderList(){

      const result =
        await original.apply(this, arguments);

      setTimeout(srJCApply, 0);

      return result;
    }

    wrappedRenderList.srJCWrapped = true;
    wrappedRenderList.srJCOriginal = original;

    window.renderList =
      wrappedRenderList;

  }


  window.srApplyJobCardGrouping =
    srJCApply;

  srJCInstall();

  window.addEventListener(
    "load",
    function(){
      srJCInstall();
      setTimeout(srJCApply, 100);
    }
  );

})();
</script>
