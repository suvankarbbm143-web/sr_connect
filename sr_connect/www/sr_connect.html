<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR Connect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            color: #374151;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        .title {
            font-size: 20px;
            font-weight: 700;
        }

        .sub {
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="loading">
    <div class="logo">SR</div>
    <div class="title">SR Connect</div>
    <div class="sub">Loading workspace...</div>
</div>

<script>
    window.location.replace("/sr_connect/home");
</script>

</body>
</html>
